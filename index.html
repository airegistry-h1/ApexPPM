  <meta name="theme-color" content="#0b1120" />

  <title>ApexPPM — Enterprise Portfolio & Program Manager</title>

  <!-- Branded SVG Icon (Matching AI Registry Hub Triangle & Circle) -->
  <script>
    (function() {
      const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <rect width="512" height="512" rx="112" fill="#0b1120"/>
        <circle cx="256" cy="256" r="140" fill="none" stroke="#10b981" stroke-width="28" stroke-dasharray="660" stroke-dashoffset="120" stroke-linecap="round"/>
        <polygon points="256,96 384,360 128,360" fill="none" stroke="#ffffff" stroke-width="26" stroke-linejoin="round"/>
        <circle cx="256" cy="272" r="32" fill="#10b981"/>
      </svg>`;
      const iconUrl = "data:image/svg+xml;base64," + btoa(svgIcon);
      const linkIcon = document.createElement("link");
      linkIcon.rel = "icon";
      linkIcon.href = iconUrl;
      document.head.appendChild(linkIcon);

      const manifest = {
        name: "ApexPPM Enterprise Cloud Manager",
        short_name: "ApexPPM",
        start_url: window.location.pathname || "./index.html",
        display: "standalone",
        background_color: "#0b1120",
        theme_color: "#10b981",
        icons: [{ src: iconUrl, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }]
      };
      const manifestBlob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
      const manifestLink = document.createElement("link");
      manifestLink.rel = "manifest";
      manifestLink.href = URL.createObjectURL(manifestBlob);
      document.head.appendChild(manifestLink);
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>

            }
          }

      }
    }

<body class="min-h-screen antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Secure DB credentials
    const DEFAULT_DB_URL = "https://tzqbzzdctwdyvwvyvwzk.supabase.co";
    const DEFAULT_DB_ANON_KEY = "sb_publishable_Jve6BGkRJUrhkX8vMlDJUA_m_4RoWpT";
    
    const TODAY_ISO = new Date().toISOString().slice(0, 10);
    const STORAGE_KEY = "apexpms_db_secure_v6";
    const THEME_KEY = "apexpms_theme";

    const parseISO = (str) => {
      if (!str) return new Date(TODAY_ISO + "T00:00:00");
      const [y, m, d] = str.split("-").map(Number);
      return new Date(y, m - 1, d);
    };

    const formatISO = (date) => {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    };

    const addDaysISO = (isoStr, days) => {
      const dt = parseISO(isoStr);
      dt.setDate(dt.getDate() + Number(days || 0));
      return formatISO(dt);
    };

    const diffDaysISO = (startISO, endISO) => {
      const s = parseISO(startISO);
      const e = parseISO(endISO);
      return Math.round((e - s) / (1000 * 60 * 60 * 24));
    };

    const formatShortDate = (isoStr) => {
      if (!isoStr) return "";
      return parseISO(isoStr).toLocaleDateString("en-US", { month: "short", day: "numeric" });
    };

    const INITIAL_EMPTY_WORKSPACE = {
      programs: [
        { id: "pgm-1", code: "PGM-01", name: "AI Registry Hub Enterprise Operations", manager: "Mustafa Nisar", budget: 250000 }
      ],
      projects: [
        { id: "prj-1", programId: "pgm-1", code: "PRJ-01", name: "Frontend Platform & PWA", methodology: "Hybrid Agile", baselineStart: TODAY_ISO }
      ],
      tasks: [],
      risks: [],
      procurements: [
        { id: "po-1", poNumber: "PO-2026-001", vendor: "Cloudflare Inc.", category: "Hosting & Edge CDN", contractType: "FFP", committed: 240, actual: 200, status: "Awarded", terms: "Net 30", deliveryDate: addDaysISO(TODAY_ISO, 30) }
      ]
    };

    function App() {
      // Theme State (Dark / Light)
      const [theme, setTheme] = useState(() => localStorage.getItem(THEME_KEY) || "dark");

      useEffect(() => {
        const root = document.documentElement;
        if (theme === "dark") root.classList.add("dark");
        else root.classList.remove("dark");
        localStorage.setItem(THEME_KEY, theme);
      }, [theme]);

      const toggleTheme = () => setTheme(prev => prev === "dark" ? "light" : "dark");

      // Authentication State
      const [user, setUser] = useState(null);
      const [authEmail, setAuthEmail] = useState("");
      const [authPassword, setAuthPassword] = useState("");
      const [authMessage, setAuthMessage] = useState("");
      const [isAuthLoading, setIsAuthLoading] = useState(true);

      // Cloud DB Sync State
      const [syncStatus, setSyncStatus] = useState("Initializing DB...");
      const [lastSyncedAt, setLastSyncedAt] = useState(null);

      // CRITICAL GUARDS: Prevent premature saves from overwriting cloud data on startup
      const isInitialCloudLoadComplete = useRef(false);
      const isPullingRef = useRef(false);

      const dbClient = useMemo(() => {
        if (!DEFAULT_DB_URL || !DEFAULT_DB_ANON_KEY || !window.supabase) return null;
        try {
          return window.supabase.createClient(DEFAULT_DB_URL, DEFAULT_DB_ANON_KEY);
        } catch (e) {
          return null;
        }
      }, []);

      const [data, setData] = useState(INITIAL_EMPTY_WORKSPACE);

      // Navigation & Modals: Default to "ALL" so no tasks are hidden on startup
      const [selectedProgramId, setSelectedProgramId] = useState("ALL");
      const [selectedProjectId, setSelectedProjectId] = useState("ALL");
      const [activeTab, setActiveTab] = useState("gantt");
      const [showManageModal, setShowManageModal] = useState(false);
      const [showReportModal, setShowReportModal] = useState(false);

      // Quick-Add inputs
      const [qaWbs, setQaWbs] = useState("");
      const [qaName, setQaName] = useState("");
      const [qaStartDate, setQaStartDate] = useState(TODAY_ISO);
      const [qaDuration, setQaDuration] = useState(5);
      const [qaEndDate, setQaEndDate] = useState(addDaysISO(TODAY_ISO, 5));
      const [qaPred, setQaPred] = useState("");
      const [qaDepType, setQaDepType] = useState("FS");
      const [qaLag, setQaLag] = useState(0);
      const [qaResource, setQaResource] = useState("Mustafa Nisar");
      const [qaAllocation, setQaAllocation] = useState(100);

      // Manage/Edit Form State
      const [editingEntity, setEditingEntity] = useState({ type: "project", id: "", code: "", name: "", manager: "", budget: 0, methodology: "" });

      // Procurement Form State
      const [newPO, setNewPO] = useState({
        poNumber: `PO-${new Date().getFullYear()}-${String(Math.floor(Math.random() * 900) + 100)}`,
        vendor: "",
        category: "Software License",
        contractType: "FFP",
        committed: 5000,
        actual: 0,
        status: "Draft",
        terms: "Net 30",
        deliveryDate: addDaysISO(TODAY_ISO, 14)
      });

      // DB Auth Session
      useEffect(() => {
        if (!dbClient) {
          setIsAuthLoading(false);
          return;
        }
        dbClient.auth.getSession().then(({ data: { session } }) => {
          setUser(session?.user ?? null);
          setIsAuthLoading(false);
        });
        const { data: { subscription } } = dbClient.auth.onAuthStateChange((_event, session) => {
          setUser(session?.user ?? null);
          setIsAuthLoading(false);
        });
        return () => subscription.unsubscribe();
      }, [dbClient]);

      // LocalStorage Recovery Helper: Scans for tasks saved before login or in prior versions
      const recoverLocalOrLegacyTasks = () => {
        const potentialKeys = [
          "apexpms_supabase_secure_v5",
          "apexpms_state",
          "apexpms_local_v1",
          "apexpms_tasks",
          "apexpms_workspace"
        ];
        for (const k of potentialKeys) {
          try {
            const raw = localStorage.getItem(k);
            if (raw) {
              const parsed = JSON.parse(raw);
              const foundTasks = parsed.tasks || (Array.isArray(parsed) ? parsed : null);
              if (foundTasks && foundTasks.length > 0) {
                return foundTasks;
              }
            }
          } catch (e) {}
        }
        return [];
      };

      // Pull workspace from Cloud DB with Fail-Safe Protection
      const pullWorkspace = async (activeUser) => {
        if (!dbClient || !activeUser) return;
        try {
          isPullingRef.current = true;
          setSyncStatus("Syncing with Cloud DB...");
          const { data: row, error } = await dbClient
            .from("workspaces")
            .select("state, updated_at")
            .eq("user_id", activeUser.id)
            .maybeSingle();

          if (error) throw error;

          if (row && row.state && row.state.programs) {
            let loadedState = row.state;

            // If cloud row has 0 tasks, check if browser has recoverable tasks from prior steps
            if (!loadedState.tasks || loadedState.tasks.length === 0) {
              const recovered = recoverLocalOrLegacyTasks();
              if (recovered.length > 0) {
                loadedState = { ...loadedState, tasks: recovered };
              }
            }

            setData(loadedState);
            setLastSyncedAt(new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
            setSyncStatus("Cloud DB Synced");
          } else {
            // First time user: check local recovery before creating empty state
            const recovered = recoverLocalOrLegacyTasks();
            const initialState = recovered.length > 0
              ? { ...INITIAL_EMPTY_WORKSPACE, tasks: recovered }
              : INITIAL_EMPTY_WORKSPACE;

            setData(initialState);
            await pushWorkspace(initialState, activeUser);
          }
        } catch (err) {
          setSyncStatus("Offline Cache");
          const recovered = recoverLocalOrLegacyTasks();
          if (recovered.length > 0) {
            setData(prev => ({ ...prev, tasks: recovered }));
          }
        } finally {
          // Unlock saving ONLY after initial load is fully finished
          isInitialCloudLoadComplete.current = true;
          setTimeout(() => { isPullingRef.current = false; }, 300);
        }
      };

      // Push workspace to Cloud DB (Strictly blocked until initial cloud pull completes)
      const pushWorkspace = async (stateToSave, activeUser) => {
        if (!dbClient || !activeUser || !isInitialCloudLoadComplete.current) return;
        try {
          setSyncStatus("Saving to DB...");
          const { error } = await dbClient
            .from("workspaces")
            .upsert({
              user_id: activeUser.id,
              email: activeUser.email,
              state: stateToSave,
              updated_at: new Date().toISOString()
            });
          if (error) throw error;
          setLastSyncedAt(new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
          setSyncStatus("Cloud DB Synced");
        } catch (err) {
          setSyncStatus("Offline Cache");
        }
      };

      // Trigger pull on user change
      useEffect(() => {
        if (user) {
          isInitialCloudLoadComplete.current = false;
          pullWorkspace(user);
        }
      }, [user]);

      // Debounced push to Supabase (Guarded against premature empty state writes)
      useEffect(() => {
        if (!user || isPullingRef.current || !isInitialCloudLoadComplete.current) return;
        const timer = setTimeout(() => {
          pushWorkspace(data, user);
        }, 600);
        return () => clearTimeout(timer);
      }, [data, user]);

      const handleAuth = async (mode) => {
        if (!dbClient) return;
        setAuthMessage("Processing...");
        try {
          if (mode === "magic") {
            const { error } = await dbClient.auth.signInWithOtp({ email: authEmail });
            if (error) throw error;
            setAuthMessage("Magic link sent to your inbox!");
          } else if (mode === "signup") {
            const { error } = await dbClient.auth.signUp({ email: authEmail, password: authPassword });
            if (error) throw error;
            setAuthMessage("Account created! Check your email to confirm.");
          } else {
            const { error } = await dbClient.auth.signInWithPassword({ email: authEmail, password: authPassword });
            if (error) throw error;
            setAuthMessage("Signed in!");
          }
        } catch (err) {
          setAuthMessage(err.message || "Authentication failed");
        }
      };

      // Filtered views
const programProjects = useMemo(() => {
  if (selectedProgramId === "ALL") return data.projects;
  return data.projects.filter(p => p.programId === selectedProgramId);
}, [data.projects, selectedProgramId]);

const visibleTasks = useMemo(() => {
  return data.tasks.filter(t => {
    // If selected project matches directly
    if (selectedProjectId !== "ALL") {
      const activePrj = data.projects.find(p => p.id === selectedProjectId);
      return t.projectId === selectedProjectId || (activePrj && t.projectId === activePrj.code);
    }
    // If selected program matches
    if (selectedProgramId !== "ALL") {
      return programProjects.some(p => p.id === t.projectId || p.code === t.projectId);
    }
    return true;
  });
}, [data.tasks, selectedProjectId, selectedProgramId, programProjects]);

      // PMI Forward & Backward Pass Critical Path Engine with Auto-Date Adjustments
      const cpmSchedule = useMemo(() => {
        if (visibleTasks.length === 0) {
          return { tasks: [], anchorDate: TODAY_ISO, totalSpanDays: 25, criticalCount: 0 };
        }

        // Map for lookup
        const taskMap = {};
        data.tasks.forEach(t => {
          taskMap[t.id] = {
            ...t,
            duration: Math.max(1, Number(t.duration || 1)),
            allocation: Number(t.allocation || 100),
            lag: Number(t.lag || 0),
            esDate: t.startDate || TODAY_ISO,
            efDate: t.endDate || addDaysISO(t.startDate || TODAY_ISO, t.duration || 1)
          };
        });

        // 1. Forward Pass: Auto adjust task start/end based on predecessor dependency types
        let changed = true;
        let passes = 0;
        while (changed && passes < 25) {
          changed = false;
          passes++;
          Object.values(taskMap).forEach(t => {
            if (t.predecessorId && taskMap[t.predecessorId]) {
              const pred = taskMap[t.predecessorId];
              const dep = t.depType || "FS";
              const lag = Number(t.lag || 0);
              let requiredStart = t.esDate;

              if (dep === "FS") {
                requiredStart = addDaysISO(pred.efDate, lag);
              } else if (dep === "SS") {
                requiredStart = addDaysISO(pred.esDate, lag);
              } else if (dep === "FF") {
                const targetEnd = addDaysISO(pred.efDate, lag);
                requiredStart = addDaysISO(targetEnd, -t.duration);
              } else if (dep === "SF") {
                const targetEnd = addDaysISO(pred.esDate, lag);
                requiredStart = addDaysISO(targetEnd, -t.duration);
              }

              if (requiredStart !== t.esDate) {
                t.esDate = requiredStart;
                t.efDate = addDaysISO(requiredStart, t.duration);
                changed = true;
              }
            }
          });
        }

        const visibleNodes = visibleTasks.map(vt => taskMap[vt.id]);
        const earliestISO = visibleNodes.reduce((min, t) => t.esDate < min ? t.esDate : min, visibleNodes[0]?.esDate || TODAY_ISO);

        visibleNodes.forEach(t => {
          t.es = Math.max(0, diffDaysISO(earliestISO, t.esDate));
          t.ef = t.es + t.duration;
        });

        // 2. Backward Pass: Calculate Late Finish (LF), Late Start (LS), and Float
        const maxEF = Math.max(...visibleNodes.map(n => n.ef), 1);
        visibleNodes.forEach(n => { n.lf = maxEF; n.ls = n.lf - n.duration; });

        for (let i = 0; i < visibleNodes.length + 2; i++) {
          visibleNodes.forEach(n => {
            const successors = visibleNodes.filter(s => s.predecessorId === n.id);
            if (successors.length > 0) {
              let minLF = maxEF;
              successors.forEach(succ => {
                const lag = Number(succ.lag || 0);
                const dep = succ.depType || "FS";
                let reqLF = maxEF;
                if (dep === "FS") reqLF = succ.ls - lag;
                else if (dep === "SS") reqLF = succ.ls - lag + n.duration;
                else if (dep === "FF") reqLF = succ.lf - lag;
                else if (dep === "SF") reqLF = succ.lf - lag + n.duration;
                if (reqLF < minLF) minLF = reqLF;
              });
              n.lf = minLF;
              n.ls = n.lf - n.duration;
            }
          });
        }

        visibleNodes.forEach(n => {
          n.float = Math.max(0, n.ls - n.es);
          n.isCritical = n.float === 0 && !n.done;
          n.displayStartDate = tDateString(n.esDate);
          n.displayEndDate = tDateString(n.efDate);
        });

        return {
          tasks: visibleNodes,
          anchorDate: earliestISO,
          totalSpanDays: Math.max(30, maxEF + 6),
          criticalCount: visibleNodes.filter(n => n.isCritical).length
        };
      }, [visibleTasks, data.tasks]);

      function tDateString(iso) {
        return iso || TODAY_ISO;
      }

      const timelineDays = useMemo(() => {
        return Array.from({ length: cpmSchedule.totalSpanDays }, (_, i) => {
          const iso = addDaysISO(cpmSchedule.anchorDate, i);
          return { index: i + 1, iso, label: formatShortDate(iso) };
        });
      }, [cpmSchedule.anchorDate, cpmSchedule.totalSpanDays]);

      // Resource Allocation Adjustment (PMI Effort-Driven Scheduling)
      const handleAllocationChange = (taskId, newAlloc) => {
        const alloc = Math.max(10, Math.min(200, Number(newAlloc || 100)));
        setData(prev => ({
          ...prev,
          tasks: prev.tasks.map(t => {
            if (t.id !== taskId) return t;
            // Base planned work in person-days = duration * (current allocation / 100)
            const baseWork = Math.max(1, Number(t.duration || 1) * (Number(t.allocation || 100) / 100));
            const newDuration = Math.max(1, Math.round(baseWork / (alloc / 100)));
            const newEnd = addDaysISO(t.startDate || TODAY_ISO, newDuration);
            return { ...t, allocation: alloc, duration: newDuration, endDate: newEnd };
          })
        }));
      };

      const handleAddTask = (e) => {
        e.preventDefault();
        if (!qaName.trim()) return;
        const targetPrjId = selectedProjectId !== "ALL" ? selectedProjectId : (programProjects[0]?.id || data.projects[0]?.id);
        const newTask = {
          id: "tsk-" + Date.now(),
          projectId: targetPrjId,
          wbs: qaWbs.trim() || `1.${visibleTasks.length + 1}`,
          name: qaName.trim(),
          startDate: qaStartDate || TODAY_ISO,
          endDate: qaEndDate || addDaysISO(qaStartDate || TODAY_ISO, qaDuration),
          duration: Math.max(1, Number(qaDuration || 1)),
          predecessorId: qaPred,
          depType: qaDepType,
          lag: Number(qaLag || 0),
          resource: qaResource,
          allocation: Number(qaAllocation || 100),
          status: "To Do",
          done: false,
          pv: 5000,
          ac: 0
        };

        // If predecessor is set, auto-cascade start date on creation
        if (newTask.predecessorId) {
          const pred = data.tasks.find(t => t.id === newTask.predecessorId);
          if (pred) {
            if (newTask.depType === "FS") {
              newTask.startDate = addDaysISO(pred.endDate || TODAY_ISO, newTask.lag);
              newTask.endDate = addDaysISO(newTask.startDate, newTask.duration);
            }
          }
        }

        setData(prev => ({ ...prev, tasks: [...prev.tasks, newTask] }));
        setQaName("");
        setQaWbs("");
      };

      const updateTaskField = (taskId, field, value) => {
        setData(prev => ({
          ...prev,
          tasks: prev.tasks.map(t => {
            if (t.id !== taskId) return t;
            const updated = { ...t, [field]: value };
            if (field === "startDate") {
              updated.endDate = addDaysISO(value, updated.duration);
            } else if (field === "duration") {
              const d = Math.max(1, Number(value || 1));
              updated.duration = d;
              updated.endDate = addDaysISO(updated.startDate || TODAY_ISO, d);
            } else if (field === "endDate") {
              const diff = diffDaysISO(updated.startDate || TODAY_ISO, value);
              if (diff >= 1) updated.duration = diff;
              else { updated.startDate = addDaysISO(value, -1); updated.duration = 1; }
            } else if (field === "done") {
              updated.status = value ? "Done" : "In Progress";
            }
            return updated;
          })
        }));
      };

      // Add Procurement Item
      const handleAddPO = (e) => {
        e.preventDefault();
        if (!newPO.vendor.trim()) return;
        setData(prev => ({
          ...prev,
          procurements: [...prev.procurements, { ...newPO, id: "po-" + Date.now() }]
        }));
        setNewPO({
          poNumber: `PO-${new Date().getFullYear()}-${String(Math.floor(Math.random() * 900) + 100)}`,
          vendor: "",
          category: "Software License",
          contractType: "FFP",
          committed: 5000,
          actual: 0,
          status: "Draft",
          terms: "Net 30",
          deliveryDate: addDaysISO(TODAY_ISO, 14)
        });
      };

      const updatePOStatus = (id, status) => {
        setData(prev => ({
          ...prev,
          procurements: prev.procurements.map(p => p.id === id ? { ...p, status } : p)
        }));
      };

      // Save Program or Project edits
      const handleSaveEntityEdit = (e) => {
        e.preventDefault();
        if (!editingEntity.name.trim()) return;

        if (editingEntity.type === "program") {
          setData(prev => ({
            ...prev,
            programs: prev.programs.map(p => p.id === editingEntity.id ? {
              ...p,
              code: editingEntity.code,
              name: editingEntity.name,
              manager: editingEntity.manager,
              budget: Number(editingEntity.budget || 0)
            } : p)
          }));
        } else {
          setData(prev => ({
            ...prev,
            projects: prev.projects.map(p => p.id === editingEntity.id ? {
              ...p,
              code: editingEntity.code,
              name: editingEntity.name,
              methodology: editingEntity.methodology
            } : p)
          }));
        }
        setShowManageModal(false);
      };

      // Google Docs Copy Helper
      const copyReportToClipboard = () => {
        const reportElement = document.getElementById("executive-report-content");
        if (!reportElement) return;
        const html = reportElement.innerHTML;
        const blob = new Blob([html], { type: "text/html" });
        const textBlob = new Blob([reportElement.innerText], { type: "text/plain" });
        navigator.clipboard.write([
          new ClipboardItem({ "text/html": blob, "text/plain": textBlob })
        ]).then(() => alert("Formatted Report copied! You can now paste directly into Google Docs."));
      };

      // Auth Gate
      if (isAuthLoading) {

                        value={newPO.contractType}
                        onChange={(e) => setNewPO({ ...newPO, contractType: e.target.value })}
                        className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-1.5 py-1.5 text-xs font-mono"
                      >
                        <option value="FFP">FFP</option>
                        <option value="T&M">T&M</option>
                        <option value="CP">CP</option>
                      </select>
                    </div>
                    <div className="w-24">
                      <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Committed ($)</label>
                      <input
                        type="number"
                        value={newPO.committed}
                        onChange={(e) => setNewPO({ ...newPO, committed: Number(e.target.value) })}
                        className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-2 py-1.5 text-xs font-mono"
                      />
                    </div>
                    <button
                      type="submit"
                      className="bg-brand-emerald hover:bg-brand-emeraldHover text-brand-navy font-bold text-xs px-4 py-2 rounded-lg transition"
                    >
                      + Create PO
                    </button>
                  </form>

                  <div className="bg-white dark:bg-[#111827] border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-sm">
                    <table className="w-full border-collapse text-left text-xs">
                      <thead>
                        <tr className="border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 text-[10px] font-bold uppercase tracking-wider text-slate-500">
                          <th className="px-4 py-3">PO NUMBER</th>
                          <th className="px-4 py-3">VENDOR</th>
                          <th className="px-3 py-3">CATEGORY</th>
                          <th className="px-3 py-3">TYPE</th>
                          <th className="px-3 py-3 text-right">COMMITTED</th>
                          <th className="px-3 py-3 text-right">ACTUAL SPEND</th>
                          <th className="px-3 py-3 text-right">VARIANCE</th>
                          <th className="px-4 py-3 text-center">STATUS</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200 dark:divide-slate-800">
                        {data.procurements.map((po) => {
                          const variance = po.committed - (po.actual || 0);
                          return (
                            <tr key={po.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/40">
                              <td className="px-4 py-3 font-mono font-medium text-brand-emerald">{po.poNumber}</td>
                              <td className="px-4 py-3 font-semibold text-slate-900 dark:text-white">{po.vendor}</td>
                              <td className="px-3 py-3 text-slate-600 dark:text-slate-300">{po.category}</td>
                              <td className="px-3 py-3 font-mono text-[11px]">{po.contractType}</td>
                              <td className="px-3 py-3 text-right font-mono">${po.committed.toLocaleString()}</td>
                              <td className="px-3 py-3 text-right font-mono">${(po.actual || 0).toLocaleString()}</td>
                              <td className={`px-3 py-3 text-right font-mono font-medium ${variance >= 0 ? "text-emerald-500" : "text-rose-500"}`}>
                                ${variance.toLocaleString()}
                              </td>
                              <td className="px-4 py-3 text-center">
                                <select
                                  value={po.status}
                                  onChange={(e) => updatePOStatus(po.id, e.target.value)}
                                  className="bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-md px-2 py-1 text-[11px] font-medium"
                                >
                                  <option value="Draft">Draft</option>
                                  <option value="Sourced">Sourced</option>
                                  <option value="In Review">In Review</option>
                                  <option value="Awarded">Awarded</option>
                                  <option value="Closed">Closed</option>
                                </select>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* Tasks Kanban Board */}
              {activeTab === "tasks" && (
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {["To Do", "In Progress", "Done"].map((col) => (
                    <div key={col} className="bg-white dark:bg-[#111827] border border-slate-200 dark:border-slate-800 rounded-2xl p-4 space-y-3 shadow-sm">
                      <div className="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-2.5">
                        <span className="font-bold text-xs uppercase tracking-wider text-slate-700 dark:text-slate-300">{col}</span>
                        <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 font-mono">
                          {cpmSchedule.tasks.filter(t => t.status === col).length}
                        </span>
                      </div>
                      {cpmSchedule.tasks.filter((t) => t.status === col).map((t) => (
                        <div key={t.id} className="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-1.5 shadow-sm">
                          <div className="flex justify-between items-center text-[11px] font-mono text-brand-emerald">
                            <span>{t.wbs}</span>
                            <span className="text-slate-400">{t.duration}d • {t.allocation}% effort</span>
                          </div>
                          <div className="text-xs font-semibold text-slate-900 dark:text-white">{t.name}</div>
                          <div className="text-[10px] text-slate-500">Resource: {t.resource || "Mustafa Nisar"}</div>
                        </div>
                      ))}
                    </div>
                  ))}
                </div>
              )}
            </main>
          </div>

          {/* Manage / Edit Program & Project Modal */}
          {showManageModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <form onSubmit={handleSaveEntityEdit} className="bg-white dark:bg-[#111827] border border-slate-200 dark:border-slate-800 rounded-3xl p-6 w-full max-w-lg space-y-4 shadow-2xl">
                <div className="flex items-center justify-between">
                  <h3 className="font-bold text-base text-slate-900 dark:text-white">Manage & Rename Portfolio Entities</h3>
                  <button type="button" onClick={() => setShowManageModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={() => {
                      const pgm = data.programs.find(p => p.id === selectedProgramId) || data.programs[0];
                      setEditingEntity({ type: "program", id: pgm.id, code: pgm.code, name: pgm.name, manager: pgm.manager, budget: pgm.budget });
                    }}
                    className={`flex-1 py-2 rounded-xl text-xs font-bold transition ${editingEntity.type === "program" ? "bg-brand-emerald text-brand-navy" : "bg-slate-100 dark:bg-slate-800 text-slate-400"}`}
                  >
                    Edit Program
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      const prj = data.projects.find(p => p.id === selectedProjectId) || data.projects[0];
                      setEditingEntity({ type: "project", id: prj.id, code: prj.code, name: prj.name, methodology: prj.methodology });
                    }}
                    className={`flex-1 py-2 rounded-xl text-xs font-bold transition ${editingEntity.type === "project" ? "bg-brand-emerald text-brand-navy" : "bg-slate-100 dark:bg-slate-800 text-slate-400"}`}
                  >
                    Edit Project
                  </button>
                </div>

                <div>
                  <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">Code</label>
                  <input
                    type="text"
                    value={editingEntity.code}
                    onChange={(e) => setEditingEntity({ ...editingEntity, code: e.target.value })}
                    className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs"
                  />
                </div>
                <div>
                  <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">Title / Name</label>
                  <input
                    type="text"
                    value={editingEntity.name}
                    onChange={(e) => setEditingEntity({ ...editingEntity, name: e.target.value })}
                    className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs"
                  />
                </div>
                {editingEntity.type === "program" ? (
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">Approved Budget ($)</label>
                    <input
                      type="number"
                      value={editingEntity.budget}
                      onChange={(e) => setEditingEntity({ ...editingEntity, budget: Number(e.target.value) })}
                      className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs font-mono"
                    />
                  </div>
                ) : (
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">Methodology</label>
                    <input
                      type="text"
                      value={editingEntity.methodology}
                      onChange={(e) => setEditingEntity({ ...editingEntity, methodology: e.target.value })}
                      className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs"
                    />
                  </div>
                )}

                <div className="flex gap-2 pt-2">
                  <button type="submit" className="flex-1 py-2.5 rounded-xl bg-brand-emerald hover:bg-brand-emeraldHover text-brand-navy font-bold text-xs transition">
                    Save Changes
                  </button>
                  <button type="button" onClick={() => setShowManageModal(false)} className="px-4 py-2.5 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-semibold">
                    Cancel
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* Document Generation & Export Modal */}
          {showReportModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white dark:bg-[#111827] border border-slate-200 dark:border-slate-800 rounded-3xl p-6 w-full max-w-3xl space-y-4 shadow-2xl max-h-[90vh] flex flex-col">
                <div className="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
                  <h3 className="font-bold text-base text-slate-900 dark:text-white">Executive PPM Status Report</h3>
                  <div className="flex gap-2">
                    <button
                      onClick={copyReportToClipboard}
                      className="bg-brand-emerald hover:bg-brand-emeraldHover text-brand-navy font-bold text-xs px-3 py-1.5 rounded-lg transition"
                    >
                      📋 Copy for Google Docs
                    </button>
                    <button
                      onClick={() => window.print()}
                      className="bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 text-xs font-semibold px-3 py-1.5 rounded-lg transition"
                    >
                      🖨️ Print / PDF
                    </button>
                    <button onClick={() => setShowReportModal(false)} className="text-slate-400 hover:text-white px-2">✕</button>
                  </div>
                </div>

                <div id="executive-report-content" className="flex-1 overflow-y-auto p-4 bg-slate-50 dark:bg-slate-900/50 rounded-2xl border border-slate-200 dark:border-slate-800 text-xs space-y-4 text-slate-800 dark:text-slate-200">
                  <div className="border-b border-slate-300 dark:border-slate-700 pb-3">
                    <h2 className="text-base font-bold text-brand-emerald">ApexPPM — Executive Project & Program Report</h2>
                    <p className="text-[11px] text-slate-500">Date: {new Date().toLocaleDateString("en-US", { dateStyle: "full" })} | Owner: Mustafa Nisar</p>
                  </div>

                  <div className="grid grid-cols-3 gap-3">
                    <div className="p-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700">
                      <div className="text-[10px] text-slate-400 font-bold uppercase">Total Tasks</div>
                      <div className="text-lg font-bold">{cpmSchedule.tasks.length}</div>
                    </div>
                    <div className="p-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700">
                      <div className="text-[10px] text-slate-400 font-bold uppercase">Critical Path Count</div>
                      <div className="text-lg font-bold text-rose-500">{cpmSchedule.criticalCount}</div>
                    </div>
                    <div className="p-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700">
                      <div className="text-[10px] text-slate-400 font-bold uppercase">Procurement Committed</div>
                      <div className="text-lg font-bold text-emerald-500">
                        ${data.procurements.reduce((acc, p) => acc + (p.committed || 0), 0).toLocaleString()}
                      </div>
                    </div>
                  </div>

                  <h3 className="font-bold text-xs uppercase tracking-wider text-slate-700 dark:text-slate-300 pt-2">Schedule Deliverables & Critical Dependencies</h3>
                  <table className="w-full border-collapse text-left border border-slate-300 dark:border-slate-700">
                    <thead>
                      <tr className="bg-slate-200 dark:bg-slate-800 text-[10px]">
                        <th className="p-2 border border-slate-300 dark:border-slate-700">WBS</th>
                        <th className="p-2 border border-slate-300 dark:border-slate-700">Deliverable Name</th>
                        <th className="p-2 border border-slate-300 dark:border-slate-700">Start Date</th>
                        <th className="p-2 border border-slate-300 dark:border-slate-700">End Date</th>
                        <th className="p-2 border border-slate-300 dark:border-slate-700">Dur</th>
                        <th className="p-2 border border-slate-300 dark:border-slate-700">Float</th>
                        <th className="p-2 border border-slate-300 dark:border-slate-700">Resource</th>
                      </tr>
                    </thead>
                    <tbody>
                      {cpmSchedule.tasks.map(t => (
                        <tr key={t.id} className={t.isCritical ? "font-bold text-rose-500" : ""}>
                          <td className="p-2 border border-slate-300 dark:border-slate-700 font-mono">{t.wbs}</td>
                          <td className="p-2 border border-slate-300 dark:border-slate-700">{t.name}</td>
                          <td className="p-2 border border-slate-300 dark:border-slate-700">{t.esDate}</td>
                          <td className="p-2 border border-slate-300 dark:border-slate-700">{t.efDate}</td>
                          <td className="p-2 border border-slate-300 dark:border-slate-700">{t.duration}d</td>
                          <td className="p-2 border border-slate-300 dark:border-slate-700">{t.float}d</td>
                          <td className="p-2 border border-slate-300 dark:border-slate-700">{t.resource || "Mustafa"} ({t.allocation}%)</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
