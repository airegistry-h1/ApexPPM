        <path d="M 256 106 A 150 150 0 1 1 142 354" fill="none" stroke="#10b981" stroke-width="26" stroke-linecap="round"/>

        <circle cx="256" cy="272" r="28" fill="#10b981"/>
      </svg>`;
      const iconUrl = "data:image/svg+xml;base64," + btoa(svgIcon);
      const linkIcon = document.createElement("link");
      linkIcon.rel = "icon";
      linkIcon.href = iconUrl;
      document.head.appendChild(linkIcon);

      const manifest = {
        name: "ApexPPM Enterprise Cloud Manager",
        short_name: "ApexPPM",

        display: "standalone",
        background_color: "#0b1120",
        theme_color: "#10b981",
        icons: [{ src: iconUrl, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }]
      };
      const manifestBlob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
      const manifestLink = document.createElement("link");
      manifestLink.rel = "manifest";
      manifestLink.href = URL.createObjectURL(manifestBlob);
      document.head.appendChild(manifestLink);
    })();
  </script>

<body class="min-h-screen antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const DEFAULT_DB_URL = window.APEX_CONFIG?.DB_URL || "https://tzqbzzdctwdyvwvyvwzk.supabase.co";
    const DEFAULT_DB_ANON_KEY = window.APEX_CONFIG?.DB_ANON_KEY || "sb_publishable_Jve6BGkRJUrhkX8vMlDJUA_m_4RoWpT";

    const TODAY_ISO = new Date().toISOString().slice(0, 10);
    const THEME_KEY = "apexpms_theme";

    // Canadian & Alberta Statutory Holidays
    const STAT_HOLIDAYS_2026 = [
      { date: "2026-01-01", name: "New Year's Day" },
      { date: "2026-02-16", name: "Family Day" },
      { date: "2026-04-03", name: "Good Friday" },
      { date: "2026-05-18", name: "Victoria Day" },
      { date: "2026-07-01", name: "Canada Day" },
      { date: "2026-08-03", name: "Heritage Day" },
      { date: "2026-09-07", name: "Labour Day" },
      { date: "2026-10-12", name: "Thanksgiving" },
      { date: "2026-11-11", name: "Remembrance Day" },
      { date: "2026-12-25", name: "Christmas Day" }
    ];

    const parseISO = (str) => {
      if (!str) return new Date(TODAY_ISO + "T00:00:00");
      const [y, m, d] = str.split("-").map(Number);
      return new Date(y, m - 1, d);
    };

    const formatISO = (date) => {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    };

    const addDaysISO = (isoStr, days) => {
      const dt = parseISO(isoStr);
      dt.setTime(dt.getTime() + Math.round(Number(days || 0) * 86400000));
      return formatISO(dt);
    };

    const diffDaysISO = (startISO, endISO) => {
      const s = parseISO(startISO);
      const e = parseISO(endISO);
      return Math.round((e - s) / 86400000);
    };

    const formatShortDate = (isoStr) => {
      if (!isoStr) return "";
      return parseISO(isoStr).toLocaleDateString("en-US", { month: "short", day: "numeric" });
    };

    const INITIAL_EMPTY_WORKSPACE = {
      programs: [
        { id: "pgm-1", code: "PGM-01", name: "AI Registry Hub Enterprise Operations", manager: "Mustafa Nisar", budget: 250000 }
      ],
      projects: [
        { id: "prj-1", programId: "pgm-1", code: "PRJ-01", name: "Frontend Platform & PWA", methodology: "Hybrid Agile", baselineStart: TODAY_ISO }
      ],
      resources: [
        { id: "res-1", name: "Mustafa Nisar", role: "Program Director / Lead Architect" },
        { id: "res-2", name: "Novera Nisar", role: "Operations Specialist" },
        { id: "res-3", name: "Core Tech Lead", role: "Fullstack Systems Engineer" },
        { id: "res-4", name: "Contract Developer", role: "Frontend UI/UX Specialist" }
      ],
      tasks: [],
      risks: [
        { id: "rsk-1", code: "RSK-01", title: "API Gateway Rate Limiting", category: "Technical", probability: 3, impact: 4, score: 12, strategy: "Mitigate", owner: "Mustafa Nisar", status: "Open" }
      ],
      procurements: [
        { id: "po-1", poNumber: "PO-2026-001", vendor: "Cloudflare Inc.", category: "Hosting & Edge CDN", contractType: "FFP", committed: 240, actual: 200, status: "Awarded", terms: "Net 30", deliveryDate: addDaysISO(TODAY_ISO, 30) }
      ]
    };

    function App() {
      const [theme, setTheme] = useState(() => localStorage.getItem(THEME_KEY) || "dark");

      useEffect(() => {
        const root = document.documentElement;
        if (theme === "dark") root.classList.add("dark");
        else root.classList.remove("dark");
        localStorage.setItem(THEME_KEY, theme);
      }, [theme]);

      const toggleTheme = () => setTheme(prev => prev === "dark" ? "light" : "dark");

      const [user, setUser] = useState(null);
      const [authEmail, setAuthEmail] = useState("");
      const [authPassword, setAuthPassword] = useState("");
      const [authMessage, setAuthMessage] = useState("");
      const [isAuthLoading, setIsAuthLoading] = useState(true);

      const [showUserMenu, setShowUserMenu] = useState(false);
      const userMenuRef = useRef(null);

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (userMenuRef.current && !userMenuRef.current.contains(e.target)) {
            setShowUserMenu(false);
          }
        };
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, []);

      const [syncStatus, setSyncStatus] = useState("Initializing DB...");
      const [lastSyncedAt, setLastSyncedAt] = useState(null);
      const isInitialCloudLoadComplete = useRef(false);
      const isPullingRef = useRef(false);

      const dbClient = useMemo(() => {
        if (!DEFAULT_DB_URL || !DEFAULT_DB_ANON_KEY || !window.supabase) return null;
        try {
          return window.supabase.createClient(DEFAULT_DB_URL, DEFAULT_DB_ANON_KEY);
        } catch (e) {
          return null;
        }
      }, []);

      const [data, setData] = useState(INITIAL_EMPTY_WORKSPACE);

      // Filters
      const [selectedProgramId, setSelectedProgramId] = useState("ALL");
      const [selectedProjectId, setSelectedProjectId] = useState("ALL");
      const [activeTab, setActiveTab] = useState("gantt");

      // Gantt Zoom & Timeline Scale
      const [ganttScale, setGanttScale] = useState("day");
      const [showHolidays, setShowHolidays] = useState(true);

      // Modals
      const [showManageModal, setShowManageModal] = useState(false);
      const [showReportModal, setShowReportModal] = useState(false);
      const [multiDepModalTask, setMultiDepModalTask] = useState(null);

      // Management Form State
      const [manageAction, setManageAction] = useState("create");
      const [manageType, setManageType] = useState("project");
      const [targetEntityId, setTargetEntityId] = useState("");
      const [editCode, setEditCode] = useState("");
      const [editName, setEditName] = useState("");
      const [editManager, setEditManager] = useState("Mustafa Nisar");
      const [editBudget, setEditBudget] = useState(150000);
      const [editMethodology, setEditMethodology] = useState("Hybrid Agile");
      const [editParentPgmId, setEditParentPgmId] = useState("");
      const [newResourceName, setNewResourceName] = useState("");
      const [newResourceRole, setNewResourceRole] = useState("Team Member");

      // Quick-Add Inputs with safe string state for typing Decimals
      const [qaType, setQaType] = useState("Task");
      const [qaWbs, setQaWbs] = useState("");
      const [qaName, setQaName] = useState("");
      const [qaStartDate, setQaStartDate] = useState(TODAY_ISO);
      const [qaDuration, setQaDuration] = useState("1");
      const [qaResource, setQaResource] = useState("Mustafa Nisar");
      const [qaAllocation, setQaAllocation] = useState(100);

      // Risk Quick-Add State
      const [newRisk, setNewRisk] = useState({
        code: `RSK-0${(data?.risks?.length || 0) + 1}`,
        title: "",
        category: "Technical",
        probability: 3,
        impact: 3,
        strategy: "Mitigate",
        owner: "Mustafa Nisar",
        status: "Open"
      });

      // Procurement Quick-Add State
      const [newPO, setNewPO] = useState({
        poNumber: `PO-${new Date().getFullYear()}-${String(Math.floor(Math.random() * 900) + 100)}`,
        vendor: "",
        category: "Software License",
        contractType: "FFP",
        committed: 5000,
        actual: 0,
        status: "Draft",
        terms: "Net 30",
        deliveryDate: addDaysISO(TODAY_ISO, 14)
      });

      useEffect(() => {
        if (!dbClient) {
          setIsAuthLoading(false);
          return;
        }
        dbClient.auth.getSession().then(({ data: { session } }) => {
          setUser(session?.user ?? null);
          setIsAuthLoading(false);
        });
        const { data: { subscription } } = dbClient.auth.onAuthStateChange((_event, session) => {
          setUser(session?.user ?? null);
          setIsAuthLoading(false);
        });
        return () => subscription.unsubscribe();
      }, [dbClient]);

      const pullWorkspace = async (activeUser) => {
        if (!dbClient || !activeUser) return;
        try {
          isPullingRef.current = true;
          setSyncStatus("Syncing with Cloud DB...");
          const { data: row, error } = await dbClient
            .from("workspaces")
            .select("state, updated_at")
            .eq("user_id", activeUser.id)
            .maybeSingle();

          if (error) throw error;

          if (row && row.state && row.state.programs) {
            const sanitizedState = {
              ...row.state,
              resources: row.state.resources || INITIAL_EMPTY_WORKSPACE.resources,
              risks: row.state.risks || INITIAL_EMPTY_WORKSPACE.risks,
              tasks: (row.state.tasks || []).map(t => {
                const isM = t.itemType === "Milestone" || Number(t.duration) === 0;
                return {
                  ...t,
                  itemType: isM ? "Milestone" : (t.itemType || "Task"),
                  duration: Number(t.duration !== undefined ? t.duration : 1),
                  resource: t.resource || "Mustafa Nisar",
                  predecessors: t.predecessors || (t.predecessorId ? [{ id: t.predecessorId, type: t.depType || "FS", lag: Number(t.lag || 0) }] : [])
                };
              })
            };
            setData(sanitizedState);
            setLastSyncedAt(new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
            setSyncStatus("Cloud DB Synced");
          } else {
            setData(INITIAL_EMPTY_WORKSPACE);
            await pushWorkspace(INITIAL_EMPTY_WORKSPACE, activeUser);
          }
        } catch (err) {
          setSyncStatus("Offline Cache");
        } finally {
          isInitialCloudLoadComplete.current = true;
          setTimeout(() => { isPullingRef.current = false; }, 300);
        }
      };

      const pushWorkspace = async (stateToSave, activeUser) => {
        if (!dbClient || !activeUser || !isInitialCloudLoadComplete.current) return;
        try {
          setSyncStatus("Saving to DB...");
          const { error } = await dbClient
            .from("workspaces")
            .upsert({
              user_id: activeUser.id,
              email: activeUser.email,
              state: stateToSave,
              updated_at: new Date().toISOString()
            });
          if (error) throw error;
          setLastSyncedAt(new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
          setSyncStatus("Cloud DB Synced");
        } catch (err) {
          setSyncStatus("Offline Cache");
        }
      };

      useEffect(() => {
        if (user) {
          isInitialCloudLoadComplete.current = false;
          pullWorkspace(user);
        }
      }, [user]);

      useEffect(() => {
        if (!user || isPullingRef.current || !isInitialCloudLoadComplete.current) return;
        const timer = setTimeout(() => {
          pushWorkspace(data, user);
        }, 600);
        return () => clearTimeout(timer);
      }, [data, user]);

      const handleAuth = async (mode) => {
        if (!dbClient) return;
        setAuthMessage("Processing...");
        try {
          if (mode === "magic") {
            const { error } = await dbClient.auth.signInWithOtp({ email: authEmail });
            if (error) throw error;
            setAuthMessage("Magic link sent!");
          } else if (mode === "signup") {
            const { error } = await dbClient.auth.signUp({ email: authEmail, password: authPassword });
            if (error) throw error;
            setAuthMessage("Account created! Check your email to confirm.");
          } else {
            const { error } = await dbClient.auth.signInWithPassword({ email: authEmail, password: authPassword });
            if (error) throw error;
            setAuthMessage("Signed in!");
          }
        } catch (err) {
          setAuthMessage(err.message || "Authentication failed");
        }
      };

      const programProjects = useMemo(() => {
        if (selectedProgramId === "ALL") return data.projects;
        return data.projects.filter(p => p.programId === selectedProgramId);
      }, [data.projects, selectedProgramId]);

      const visibleTasks = useMemo(() => {
        return data.tasks.filter(t => {
          if (selectedProjectId !== "ALL") {
            const activePrj = data.projects.find(p => p.id === selectedProjectId);
            return t.projectId === selectedProjectId || (activePrj && t.projectId === activePrj.code);
          }
          if (selectedProgramId !== "ALL") {
            return programProjects.some(p => p.id === t.projectId || p.code === t.projectId);
          }
          return true;
        });
      }, [data.tasks, selectedProjectId, selectedProgramId, programProjects]);

      // Float / Decimal CPM Engine
      const cpmSchedule = useMemo(() => {
        if (visibleTasks.length === 0) {
          return { tasks: [], anchorDate: TODAY_ISO, totalSpanDays: 30, criticalCount: 0, rawMap: {} };
        }

        const taskMap = {};
        data.tasks.forEach(t => {
          const isMilestone = t.itemType === "Milestone" || Number(t.duration) === 0;
          const dur = isMilestone ? 0 : Math.max(0.01, Number(t.duration || 1));
          taskMap[t.id] = {
            ...t,
            itemType: isMilestone ? "Milestone" : (t.itemType || "Task"),
            duration: dur,
            allocation: Number(t.allocation || 100),
            predecessors: t.predecessors || (t.predecessorId ? [{ id: t.predecessorId, type: t.depType || "FS", lag: Number(t.lag || 0) }] : []),
            esDate: t.startDate || TODAY_ISO,
            efDate: t.endDate || (isMilestone ? (t.startDate || TODAY_ISO) : addDaysISO(t.startDate || TODAY_ISO, Math.ceil(dur)))
          };
        });

        // Forward Pass
        let changed = true;
        let passes = 0;
        while (changed && passes < 30) {
          changed = false;
          passes++;
          Object.values(taskMap).forEach(t => {
            if (t.predecessors && t.predecessors.length > 0) {
              let latestReqStart = t.esDate;
              t.predecessors.forEach(predRef => {
                const pred = taskMap[predRef.id];
                if (!pred) return;
                const dep = predRef.type || "FS";
                const lag = Number(predRef.lag || 0);
                let candidateStart = t.esDate;

                if (dep === "FS") candidateStart = addDaysISO(pred.efDate, lag);
                else if (dep === "SS") candidateStart = addDaysISO(pred.esDate, lag);
                else if (dep === "FF") candidateStart = addDaysISO(addDaysISO(pred.efDate, lag), -Math.ceil(t.duration));
                else if (dep === "SF") candidateStart = addDaysISO(addDaysISO(pred.esDate, lag), -Math.ceil(t.duration));

                if (candidateStart > latestReqStart) latestReqStart = candidateStart;
              });

              if (latestReqStart !== t.esDate) {
                t.esDate = latestReqStart;
                t.efDate = t.itemType === "Milestone" ? latestReqStart : addDaysISO(latestReqStart, Math.ceil(t.duration));
                changed = true;
              }
            }
          });
        }

        const visibleNodes = visibleTasks.map(vt => taskMap[vt.id]);
        const earliestISO = visibleNodes.reduce((min, t) => t.esDate < min ? t.esDate : min, visibleNodes[0]?.esDate || TODAY_ISO);

        visibleNodes.forEach(t => {
          t.es = Math.max(0, diffDaysISO(earliestISO, t.esDate));
          t.ef = t.es + (t.itemType === "Milestone" ? 0 : t.duration);
        });

        // Backward Pass
        const maxEF = Math.max(...visibleNodes.map(n => n.ef), 1);
        visibleNodes.forEach(n => { n.lf = maxEF; n.ls = n.lf - n.duration; });

        for (let i = 0; i < visibleNodes.length + 2; i++) {
          visibleNodes.forEach(n => {
            const successors = visibleNodes.filter(s => s.predecessors?.some(p => p.id === n.id));
            if (successors.length > 0) {
              let minLF = maxEF;
              successors.forEach(succ => {
                const rel = succ.predecessors.find(p => p.id === n.id);
                const lag = Number(rel?.lag || 0);
                const dep = rel?.type || "FS";
                let reqLF = maxEF;

                if (dep === "FS") reqLF = succ.ls - lag;
                else if (dep === "SS") reqLF = succ.ls - lag + n.duration;
                else if (dep === "FF") reqLF = succ.lf - lag;
                else if (dep === "SF") reqLF = succ.lf - lag + n.duration;

                if (reqLF < minLF) minLF = reqLF;
              });
              n.lf = minLF;
              n.ls = n.lf - n.duration;
            }
          });
        }

        visibleNodes.forEach(n => {
          n.float = Math.max(0, Math.round((n.ls - n.es) * 100) / 100);
          n.isCritical = n.float === 0 && !n.done;
        });

        return {
          tasks: visibleNodes,
          anchorDate: earliestISO,
          totalSpanDays: Math.max(30, Math.ceil(maxEF) + 6),
          criticalCount: visibleNodes.filter(n => n.isCritical).length,
          rawMap: taskMap
        };
      }, [visibleTasks, data.tasks]);

      // Timeline scale generator
      const timelineUnits = useMemo(() => {
        const totalDays = cpmSchedule.totalSpanDays;
        const anchor = cpmSchedule.anchorDate;

        if (ganttScale === "day") {
          return Array.from({ length: totalDays }, (_, i) => {
            const iso = addDaysISO(anchor, i);
            const holiday = STAT_HOLIDAYS_2026.find(h => h.date === iso);
            return {
              key: i,
              label: formatShortDate(iso),
              subLabel: `D${i + 1}`,
              iso,
              widthPx: 42,
              isHoliday: !!holiday,
              holidayName: holiday?.name
            };
          });
        } else if (ganttScale === "week") {
          const numWeeks = Math.ceil(totalDays / 7) + 1;
          return Array.from({ length: numWeeks }, (_, i) => {
            const startISO = addDaysISO(anchor, i * 7);
            return {
              key: i,
              label: `W${i + 1}`,
              subLabel: formatShortDate(startISO),
              iso: startISO,
              widthPx: 64,
              daysSpan: 7
            };
          });
        } else if (ganttScale === "month") {
          const numMonths = Math.ceil(totalDays / 30) + 2;
          return Array.from({ length: numMonths }, (_, i) => {
            const startISO = addDaysISO(anchor, i * 30);
            const d = parseISO(startISO);
            return {
              key: i,
              label: d.toLocaleDateString("en-US", { month: "short", year: "2-digit" }),
              subLabel: `M${i + 1}`,
              iso: startISO,
              widthPx: 110,
              daysSpan: 30
            };
          });
        } else {
          const numQuarters = Math.ceil(totalDays / 90) + 2;
          return Array.from({ length: numQuarters }, (_, i) => {
            const startISO = addDaysISO(anchor, i * 90);
            return {
              key: i,
              label: `Q${Math.floor(i % 4) + 1} '26`,
              subLabel: formatShortDate(startISO),
              iso: startISO,
              widthPx: 160,
              daysSpan: 90
            };
          });
        }
      }, [cpmSchedule.totalSpanDays, cpmSchedule.anchorDate, ganttScale]);

      const pxPerDay = useMemo(() => {
        if (ganttScale === "day") return 42;
        if (ganttScale === "week") return 64 / 7;
        if (ganttScale === "month") return 110 / 30;
        return 160 / 90;
      }, [ganttScale]);

      // Reordering Handlers
      const moveTaskOrder = (taskId, direction) => {
        const index = data.tasks.findIndex(t => t.id === taskId);
        if (index < 0) return;
        const targetIndex = direction === "up" ? index - 1 : index + 1;
        if (targetIndex < 0 || targetIndex >= data.tasks.length) return;

        const updated = [...data.tasks];
        const [moved] = updated.splice(index, 1);
        updated.splice(targetIndex, 0, moved);
        setData(prev => ({ ...prev, tasks: updated }));
      };

      // Effort-Driven Allocation Handler
      const handleAllocationChange = (taskId, newAlloc) => {
        const alloc = Math.max(10, Math.min(200, Number(newAlloc || 100)));
        setData(prev => ({
          ...prev,
          tasks: prev.tasks.map(t => {
            if (t.id !== taskId || t.itemType === "Milestone") return t;
            const baseWork = Math.max(0.125, Number(t.duration || 1) * (Number(t.allocation || 100) / 100));
            const newDuration = Math.round((baseWork / (alloc / 100)) * 100) / 100;
            const newEnd = addDaysISO(t.startDate || TODAY_ISO, Math.ceil(newDuration));
            return { ...t, allocation: alloc, duration: newDuration, endDate: newEnd };
          })
        }));
      };

      // Item CRUD Handlers (Unblocked from erroneous milestone lock)
      const handleAddItem = (e) => {
        e.preventDefault();
        if (!qaName.trim()) return;
        const targetPrjId = selectedProjectId !== "ALL" ? selectedProjectId : (programProjects[0]?.id || data.projects[0]?.id);
        const isMilestone = qaType === "Milestone";
        const parsedDur = isMilestone ? 0 : Math.max(0.01, parseFloat(qaDuration) || 1);

        const newItem = {
          id: "tsk-" + Date.now(),
          projectId: targetPrjId,
          itemType: qaType,
          wbs: qaWbs.trim() || `1.${visibleTasks.length + 1}`,
          name: qaName.trim(),
          startDate: qaStartDate || TODAY_ISO,
          endDate: isMilestone ? (qaStartDate || TODAY_ISO) : addDaysISO(qaStartDate || TODAY_ISO, Math.ceil(parsedDur)),
          duration: parsedDur,
          predecessors: [],
          resource: qaResource,
          allocation: Number(qaAllocation || 100),
          status: "To Do",
          done: false,
          pv: isMilestone ? 0 : 5000,
          ac: 0
        };

        setData(prev => ({ ...prev, tasks: [...prev.tasks, newItem] }));
        setQaName("");
        setQaWbs("");
      };

      // Robust Field Update: Handles switching between Milestone & Task cleanly
      const updateTaskField = (taskId, field, value) => {
        setData(prev => ({
          ...prev,
          tasks: prev.tasks.map(t => {
            if (t.id !== taskId) return t;
            const updated = { ...t };

            if (field === "itemType") {
              updated.itemType = value;
              if (value === "Milestone") {
                updated.duration = 0;
                updated.endDate = updated.startDate;
              } else {
                // Restoring from Milestone to Task: ensure duration is at least 0.5 or 1 day
                if (Number(updated.duration) <= 0) {
                  updated.duration = 1;
                  updated.endDate = addDaysISO(updated.startDate, 1);
                }
              }
            } else if (field === "duration") {
              const parsed = parseFloat(value);
              if (isNaN(parsed) || parsed <= 0) {
                updated.duration = 0;
                updated.itemType = "Milestone";
                updated.endDate = updated.startDate;
              } else {
                updated.duration = parsed;
                updated.itemType = "Task";
                updated.endDate = addDaysISO(updated.startDate, Math.ceil(parsed));
              }
            } else if (field === "startDate") {
              updated.startDate = value;
              updated.endDate = updated.itemType === "Milestone" ? value : addDaysISO(value, Math.ceil(updated.duration));
            } else if (field === "endDate") {
              updated.endDate = value;
              const diff = diffDaysISO(updated.startDate || TODAY_ISO, value);
              if (diff > 0) {
                updated.duration = diff;
                updated.itemType = "Task";
              } else {
                updated.duration = 0;
                updated.itemType = "Milestone";
              }
            } else if (field === "done") {
              updated.done = value;
              updated.status = value ? "Done" : "In Progress";
            } else {
              updated[field] = value;
            }
            return updated;
          })
        }));
      };

      const deleteTask = (taskId) => {
        if (!confirm("Delete this deliverable?")) return;
        setData(prev => ({
          ...prev,
          tasks: prev.tasks
            .filter(t => t.id !== taskId)
            .map(t => ({
              ...t,
              predecessors: (t.predecessors || []).filter(p => p.id !== taskId)
            }))
        }));
      };

      // Cross-Project Predecessor Links
      const addPredecessor = (taskId, predId, type = "FS", lag = 0) => {
        if (!predId || predId === taskId) return;
        setData(prev => ({
          ...prev,
          tasks: prev.tasks.map(t => {
            if (t.id !== taskId) return t;
            const existing = t.predecessors || [];
            if (existing.some(p => p.id === predId)) return t;
            return { ...t, predecessors: [...existing, { id: predId, type, lag: Number(lag || 0) }] };
          })
        }));
      };

      const removePredecessor = (taskId, predId) => {
        setData(prev => ({
          ...prev,
          tasks: prev.tasks.map(t => {
            if (t.id !== taskId) return t;
            return { ...t, predecessors: (t.predecessors || []).filter(p => p.id !== predId) };

      // Program / Project / Resource Handlers
      const handleProgramProjectSubmit = (e) => {
        e.preventDefault();

        if (manageAction === "create") {

            if (!newResourceName.trim()) return;
            const newRes = { id: "res-" + Date.now(), name: newResourceName.trim(), role: newResourceRole };

            setNewResourceName("");

            if (!editName.trim()) return;

              id: newId,
              code: editCode.trim() || `PGM-0${data.programs.length + 1}`,
              name: editName.trim(),
              manager: editManager || "Mustafa Nisar",

            };
            setData(prev => ({ ...prev, programs: [...prev.programs, newPgm] }));
            setSelectedProgramId(newId);
          } else {
            if (!editName.trim()) return;
            const newId = "prj-" + Date.now();
            const parentPgm = editParentPgmId || (selectedProgramId !== "ALL" ? selectedProgramId : data.programs[0]?.id);
            const count = data.projects.filter(p => p.programId === parentPgm).length;
            const newPrj = {
              id: newId,
              programId: parentPgm,
              code: editCode.trim() || `PRJ-0${count + 1}`,
              name: editName.trim(),
              methodology: editMethodology || "Hybrid Agile",
              baselineStart: TODAY_ISO
            };
            setData(prev => ({ ...prev, projects: [...prev.projects, newPrj] }));
            setSelectedProjectId(newId);
          }
        } else if (manageAction === "edit") {
          if (manageType === "program") {
            setData(prev => ({
              ...prev,
              programs: prev.programs.map(p => p.id === targetEntityId ? {
                ...p, code: editCode, name: editName, manager: editManager, budget: Number(editBudget || 0)
              } : p)
            }));
          } else if (manageType === "project") {
            setData(prev => ({
              ...prev,
              projects: prev.projects.map(p => p.id === targetEntityId ? {
                ...p, code: editCode, name: editName, methodology: editMethodology
              } : p)
            }));
          }
        }
        setShowManageModal(false);
      };

      const deleteProgram = (pgmId) => {
        if (data.programs.length <= 1) {
          alert("Cannot delete the only remaining program.");
          return;
        }
        if (!confirm("Are you sure? This will delete all child projects and deliverables.")) return;
        const prjIds = data.projects.filter(p => p.programId === pgmId).map(p => p.id);
        setData(prev => ({
          ...prev,
          programs: prev.programs.filter(p => p.id !== pgmId),
          projects: prev.projects.filter(p => p.programId !== pgmId),
          tasks: prev.tasks.filter(t => !prjIds.includes(t.projectId))

        const reportElement = document.getElementById("executive-report-content");

        const html = reportElement.innerHTML;
        const blob = new Blob([html], { type: "text/html" });
        const textBlob = new Blob([reportElement.innerText], { type: "text/plain" });

                  <span className="text-[11px] px-2 py-0.5 rounded-full border bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-500/30 font-medium">

            {/* Central Filter Controls */}

              <select

                onChange={(e) => setSelectedProgramId(e.target.value)}
                className="bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-800 dark:text-slate-200 font-medium"
              >
                <option value="ALL">All Programs ({data.programs.length})</option>

              <select

              >

                    <div>
                      <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Programs</h4>
                      <div className="space-y-1.5">
                        {data.programs.map(pgm => (
                          <div key={pgm.id} className="flex items-center justify-between p-2.5 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 text-xs">
                            <div>
                              <span className="font-mono font-bold text-brand-emerald">{pgm.code}: </span>
                              <span className="font-semibold">{pgm.name}</span>
                            </div>
                            <button onClick={() => deleteProgram(pgm.id)} className="text-slate-400 hover:text-rose-500 font-bold px-2 py-1">✕</button>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div>
                      <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Projects</h4>
                      <div className="space-y-1.5">
                        {data.projects.map(prj => (
                          <div key={prj.id} className="flex items-center justify-between p-2.5 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 text-xs">
                            <div>
                              <span className="font-mono font-bold text-indigo-400">{prj.code}: </span>
                              <span className="font-semibold">{prj.name}</span>
                            </div>
                            <button onClick={() => deleteProject(prj.id)} className="text-slate-400 hover:text-rose-500 font-bold px-2 py-1">✕</button>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Executive Report Export Modal */}
          {showReportModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white dark:bg-[#111827] border border-slate-200 dark:border-slate-800 rounded-3xl p-6 w-full max-w-3xl space-y-4 shadow-2xl max-h-[90vh] flex flex-col">
                <div className="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
                  <h3 className="font-bold text-base text-slate-900 dark:text-white">Executive PPM Status Report</h3>
                  <div className="flex gap-2">
                    <button
                      onClick={copyReportToClipboard}
                      className="bg-brand-emerald hover:bg-brand-emeraldHover text-brand-navy font-bold text-xs px-3 py-1.5 rounded-lg transition"
                    >
                      📋 Copy for Google Docs
                    </button>
                    <button
                      onClick={() => window.print()}
                      className="bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 text-xs font-semibold px-3 py-1.5 rounded-lg transition"
                    >
                      🖨️ Print / PDF
                    </button>
                    <button onClick={() => setShowReportModal(false)} className="text-slate-400 hover:text-white px-2">✕</button>
                  </div>
                </div>

                <div id="executive-report-content" className="flex-1 overflow-y-auto p-4 bg-slate-50 dark:bg-slate-900/50 rounded-2xl border border-slate-200 dark:border-slate-800 text-xs space-y-4 text-slate-800 dark:text-slate-200">
                  <div className="border-b border-slate-300 dark:border-slate-700 pb-3">
                    <h2 className="text-base font-bold text-brand-emerald">ApexPPM — Executive Project & Program Report</h2>
                    <p className="text-[11px] text-slate-500">Date: {new Date().toLocaleDateString("en-US", { dateStyle: "full" })} | Owner: Mustafa Nisar</p>
                  </div>

                  <div className="grid grid-cols-3 gap-3">
                    <div className="p-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700">
                      <div className="text-[10px] text-slate-400 font-bold uppercase">Total Deliverables</div>
                      <div className="text-lg font-bold">{cpmSchedule.tasks.length}</div>
                    </div>
                    <div className="p-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700">
                      <div className="text-[10px] text-slate-400 font-bold uppercase">Critical Path Count</div>
                      <div className="text-lg font-bold text-rose-500">{cpmSchedule.criticalCount}</div>
                    </div>
                    <div className="p-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700">
                      <div className="text-[10px] text-slate-400 font-bold uppercase">Open Risks</div>
                      <div className="text-lg font-bold text-amber-500">{(data.risks || []).filter(r => r.status === 'Open').length}</div>
                    </div>
                  </div>

                  <h3 className="font-bold text-xs uppercase tracking-wider text-slate-700 dark:text-slate-300 pt-2">Schedule Deliverables & Milestones</h3>
                  <table className="w-full border-collapse text-left border border-slate-300 dark:border-slate-700">
                    <thead>
                      <tr className="bg-slate-200 dark:bg-slate-800 text-[10px]">
                        <th className="p-2 border border-slate-300 dark:border-slate-700">WBS</th>
                        <th className="p-2 border border-slate-300 dark:border-slate-700">Type</th>
                        <th className="p-2 border border-slate-300 dark:border-slate-700">Deliverable Name</th>
                        <th className="p-2 border border-slate-300 dark:border-slate-700">Start Date</th>
                        <th className="p-2 border border-slate-300 dark:border-slate-700">End Date</th>
                        <th className="p-2 border border-slate-300 dark:border-slate-700">Dur</th>
                        <th className="p-2 border border-slate-300 dark:border-slate-700">Float</th>
                        <th className="p-2 border border-slate-300 dark:border-slate-700">Resource</th>
                      </tr>
                    </thead>
                    <tbody>
                      {cpmSchedule.tasks.map(t => (
                        <tr key={t.id} className={t.isCritical ? "font-bold text-rose-500" : ""}>
                          <td className="p-2 border border-slate-300 dark:border-slate-700 font-mono">{t.wbs}</td>
                          <td className="p-2 border border-slate-300 dark:border-slate-700">{t.itemType || "Task"}</td>
                          <td className="p-2 border border-slate-300 dark:border-slate-700">{t.name}</td>
                          <td className="p-2 border border-slate-300 dark:border-slate-700">{t.esDate}</td>
                          <td className="p-2 border border-slate-300 dark:border-slate-700">{t.efDate}</td>
                          <td className="p-2 border border-slate-300 dark:border-slate-700">{t.duration}d</td>
                          <td className="p-2 border border-slate-300 dark:border-slate-700">{t.float}d</td>
                          <td className="p-2 border border-slate-300 dark:border-slate-700">{t.resource || "Mustafa Nisar"} ({t.allocation}%)</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
