  <!-- Branded Vector SVG Favicon -->
  <script>
    (function() {
      const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <rect width="512" height="512" rx="100" fill="#0b1120"/>
        <path d="M 256 106 A 150 150 0 1 1 142 354" fill="none" stroke="#10b981" stroke-width="26" stroke-linecap="round"/>
        <polygon points="256,92 388,364 124,364" fill="none" stroke="#ffffff" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="256" cy="272" r="28" fill="#10b981"/>
      </svg>`;
      const iconUrl = "data:image/svg+xml;base64," + btoa(svgIcon);
      const linkIcon = document.createElement("link");
      linkIcon.rel = "icon";
      linkIcon.href = iconUrl;
      document.head.appendChild(linkIcon);

      const manifest = {
        name: "Apex PPM Enterprise Cloud Manager",
        short_name: "Apex PPM",
        start_url: window.location.pathname || "./index.html",
        display: "standalone",
        background_color: "#0b1120",
        theme_color: "#10b981",
        icons: [{ src: iconUrl, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }]
      };
      const manifestBlob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
      const manifestLink = document.createElement("link");
      manifestLink.rel = "manifest";
      manifestLink.href = URL.createObjectURL(manifestBlob);
      document.head.appendChild(manifestLink);
    })();
  </script>

<body class="min-h-screen antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const DEFAULT_DB_URL = window.APEX_CONFIG?.DB_URL || "https://tzqbzzdctwdyvwvyvwzk.supabase.co";
    const DEFAULT_DB_ANON_KEY = window.APEX_CONFIG?.DB_ANON_KEY || "sb_publishable_Jve6BGkRJUrhkX8vMlDJUA_m_4RoWpT";

    const TODAY_ISO = new Date().toISOString().slice(0, 10);
    const THEME_KEY = "apexpms_theme";

    // Canadian & US Statutory Holidays (2026) - 2-Day US Thanksgiving Included
    const CA_STAT_HOLIDAYS_2026 = [
      { date: "2026-01-01", name: "New Year's Day (CA/US)" },
      { date: "2026-02-16", name: "Family Day (AB)" },
      { date: "2026-04-03", name: "Good Friday (CA)" },
      { date: "2026-05-18", name: "Victoria Day (CA)" },
      { date: "2026-07-01", name: "Canada Day (CA)" },
      { date: "2026-08-03", name: "Heritage Day (AB)" },
      { date: "2026-09-07", name: "Labour Day (CA/US)" },
      { date: "2026-10-12", name: "Thanksgiving (CA)" },
      { date: "2026-11-11", name: "Remembrance Day (CA)" },
      { date: "2026-12-25", name: "Christmas Day (CA/US)" }
    ];

    const US_STAT_HOLIDAYS_2026 = [
      { date: "2026-01-01", name: "New Year's Day (US/CA)" },
      { date: "2026-01-19", name: "Martin Luther King Jr. Day (US)" },
      { date: "2026-02-16", name: "Presidents' Day (US)" },
      { date: "2026-05-25", name: "Memorial Day (US)" },
      { date: "2026-06-19", name: "Juneteenth (US)" },
      { date: "2026-07-04", name: "Independence Day (US)" },
      { date: "2026-09-07", name: "Labor Day (US/CA)" },
      { date: "2026-10-12", name: "Columbus Day (US)" },
      { date: "2026-11-11", name: "Veterans Day (US)" },
      { date: "2026-11-26", name: "Thanksgiving Day (US)" },
      { date: "2026-11-27", name: "Day After Thanksgiving (US)" },
      { date: "2026-12-25", name: "Christmas Day (US/CA)" }
    ];

    const parseISO = (str) => {
      if (!str) return new Date(TODAY_ISO + "T00:00:00");
      const [y, m, d] = str.split("-").map(Number);
      return new Date(y, m - 1, d);
    };

    const formatISO = (date) => {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    };

    const addDaysISO = (isoStr, days) => {
      const dt = parseISO(isoStr);
      dt.setTime(dt.getTime() + Math.round(Number(days || 0) * 86400000));
      return formatISO(dt);
    };

    const diffDaysISO = (startISO, endISO) => {
      const s = parseISO(startISO);
      const e = parseISO(endISO);
      return Math.round((e - s) / 86400000);
    };

    const formatShortDate = (isoStr) => {
      if (!isoStr) return "";
      return parseISO(isoStr).toLocaleDateString("en-US", { month: "short", day: "numeric" });
    };

    const INITIAL_EMPTY_WORKSPACE = {
      programs: [
        { id: "pgm-1", code: "PGM-01", name: "Main Program", manager: "Program Manager", budget: 100000 }
      ],
      projects: [
        { id: "prj-1", programId: "pgm-1", code: "PRJ-01", name: "Core Project", methodology: "Hybrid Agile", baselineStart: TODAY_ISO }
      ],
      teamMembers: [],
      resources: [
        { id: "res-1", name: "Mustafa Nisar", role: "Program Director / Lead", dailyHours: 10, daysPerWeek: 7, isAgent: false },
        { id: "res-2", name: "Gemini", role: "Autonomous AI Agent", dailyHours: 8, daysPerWeek: 7, isAgent: true },
        { id: "res-3", name: "Lovable", role: "Fullstack App Builder Agent", dailyHours: 6, daysPerWeek: 7, isAgent: true }
      ],
      tasks: [],
      operations: [
        {
          id: "ops-1",
          name: "Daily AI Tech Chronicle Newsletter Digest",
          cadence: "daily_weekdays",
          active: true,
          assignments: [
            { name: "Mustafa Nisar", allocation: 25, dailyHours: 2.5 },
            { name: "Gemini", allocation: 50, dailyHours: 4.0 }
          ]
        },
        {
          id: "ops-2",
          name: "Compliance & Dossier Audit Sweeps (2x Daily)",
          cadence: "twice_daily",
          active: true,
          assignments: [
            { name: "Gemini", allocation: 50, dailyHours: 4.0 }
          ]
        },
        {
          id: "ops-3",
          name: "Weekly Frontier Labs Audit (Mondays)",
          cadence: "weekly_mon",
          active: true,
          assignments: [
            { name: "Gemini", allocation: 30, dailyHours: 2.4 }
          ]
        },
        {
          id: "ops-4",
          name: "Daily Tracker Catalog DB Synchronization",
          cadence: "daily_7days",
          active: true,
          assignments: [
            { name: "Mustafa Nisar", allocation: 15, dailyHours: 1.5 },
            { name: "Lovable", allocation: 25, dailyHours: 1.5 }
          ]
        }
      ],
      risks: [],
      procurements: []
    };

    function App() {
      const [theme, setTheme] = useState(() => localStorage.getItem(THEME_KEY) || "dark");

      useEffect(() => {
        const root = document.documentElement;
        if (theme === "dark") root.classList.add("dark");
        else root.classList.remove("dark");
        localStorage.setItem(THEME_KEY, theme);
      }, [theme]);

      const toggleTheme = () => setTheme(prev => prev === "dark" ? "light" : "dark");

      const [user, setUser] = useState(null);
      const [authEmail, setAuthEmail] = useState("");
      const [authPassword, setAuthPassword] = useState("");
      const [authMessage, setAuthMessage] = useState("");
      const [isAuthLoading, setIsAuthLoading] = useState(true);

      const [showUserMenu, setShowUserMenu] = useState(false);
      const userMenuRef = useRef(null);

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (userMenuRef.current && !userMenuRef.current.contains(e.target)) {
            setShowUserMenu(false);
          }
        };
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, []);

      const [syncStatus, setSyncStatus] = useState("Initializing DB...");
      const [lastSyncedAt, setLastSyncedAt] = useState(null);
      const isInitialCloudLoadComplete = useRef(false);
      const isPullingRef = useRef(false);

      const dbClient = useMemo(() => {
        if (!DEFAULT_DB_URL || !DEFAULT_DB_ANON_KEY || !window.supabase) return null;
        try {
          return window.supabase.createClient(DEFAULT_DB_URL, DEFAULT_DB_ANON_KEY);
        } catch (e) {
          return null;
        }
      }, []);

      const [data, setData] = useState(INITIAL_EMPTY_WORKSPACE);

      // Filters
      const [selectedProgramId, setSelectedProgramId] = useState("ALL");
      const [selectedProjectId, setSelectedProjectId] = useState("ALL");
      const [activeTab, setActiveTab] = useState("gantt");

      // Heatmap Metric: "hours" or "percentage"
      const [heatmapMetric, setHeatmapMetric] = useState("hours");

      // Gantt Zoom & Timeline Scale & Holiday Region Selector
      const [ganttScale, setGanttScale] = useState("day");
      const [holidayRegion, setHolidayRegion] = useState("BOTH");

      const activeStatHolidays = useMemo(() => {
        if (holidayRegion === "CA_AB") return CA_STAT_HOLIDAYS_2026;
        if (holidayRegion === "US") return US_STAT_HOLIDAYS_2026;
        if (holidayRegion === "BOTH") {
          const map = {};
          [...CA_STAT_HOLIDAYS_2026, ...US_STAT_HOLIDAYS_2026].forEach(h => {
            map[h.date] = map[h.date] ? `${map[h.date]} & ${h.name}` : h.name;
          });
          return Object.keys(map).map(date => ({ date, name: map[date] }));
        }
        return [];
      }, [holidayRegion]);

      // Modals
      const [showManageModal, setShowManageModal] = useState(false);
      const [showReportModal, setShowReportModal] = useState(false);
      const [multiDepModalTask, setMultiDepModalTask] = useState(null);
      const [assignModalTask, setAssignModalTask] = useState(null);
      const [descModalTask, setDescModalTask] = useState(null);
      const [editingOpWorkers, setEditingOpWorkers] = useState(null); // Modal for editing workers on a specific recurring operation

      // Management Form State
      const [manageAction, setManageAction] = useState("edit");
      const [manageType, setManageType] = useState("project");
      const [selectedEditProgramId, setSelectedEditProgramId] = useState("");
      const [selectedEditProjectId, setSelectedEditProjectId] = useState("");
      const [selectedEditResourceId, setSelectedEditResourceId] = useState("");
      const [editCode, setEditCode] = useState("");
      const [editName, setEditName] = useState("");
      const [editManager, setEditManager] = useState("");
      const [editBudget, setEditBudget] = useState(100000);
      const [editMethodology, setEditMethodology] = useState("Hybrid Agile");
      const [editParentPgmId, setEditParentPgmId] = useState("");

      // Resource / Team Form State
      const [newResourceName, setNewResourceName] = useState("");
      const [newResourceRole, setNewResourceRole] = useState("Team Member");
      const [newResourceHours, setNewResourceHours] = useState(10);
      const [newResourceDaysWeek, setNewResourceDaysWeek] = useState(7);
      const [newResourceIsAgent, setNewResourceIsAgent] = useState(false);
      const [newMemberEmail, setNewMemberEmail] = useState("");
      const [newMemberRole, setNewMemberRole] = useState("Editor");

      // Quick-Add Inputs
      const [qaType, setQaType] = useState("Task");
      const [qaWbs, setQaWbs] = useState("");
      const [qaName, setQaName] = useState("");
      const [qaStartDate, setQaStartDate] = useState(TODAY_ISO);
      const [qaDuration, setQaDuration] = useState("1");
      const [qaResource, setQaResource] = useState("");
      const [qaHoursPerDay, setQaHoursPerDay] = useState(10);
      const [qaAllocation, setQaAllocation] = useState(100);

      // Operations Quick-Add State
      const [newOpName, setNewOpName] = useState("");
      const [newOpCadence, setNewOpCadence] = useState("daily_weekdays");
      const [newOpResource, setNewOpResource] = useState("");
      const [newOpHours, setNewOpHours] = useState(2.5);
      const [newOpAlloc, setNewOpAlloc] = useState(25);

      useEffect(() => {
        if (!qaResource && data.resources && data.resources.length > 0) {
          setQaResource(data.resources[0].name);
        }
        if (!newOpResource && data.resources && data.resources.length > 0) {
          setNewOpResource(data.resources[0].name);
        }
      }, [data.resources]);

      const getResourceCapacity = (resourceName) => {
        const found = (data.resources || []).find(r => r.name === resourceName);
        if (found) {
          return {
            dailyHours: Number(found.dailyHours || (resourceName === "Mustafa Nisar" ? 10 : 8)),
            daysPerWeek: Number(found.daysPerWeek || (resourceName === "Mustafa Nisar" ? 7 : 5))
          };
        }
        return {
          dailyHours: resourceName === "Mustafa Nisar" ? 10 : 8,
          daysPerWeek: resourceName === "Mustafa Nisar" ? 7 : 5
        };
      };

      const loadProjectForEdit = (prjId) => {
        const prj = data.projects.find(p => p.id === prjId) || data.projects[0];
        if (prj) {
          setSelectedEditProjectId(prj.id);
          setEditCode(prj.code);
          setEditName(prj.name);
          setEditMethodology(prj.methodology || "Hybrid Agile");
        }
      };

      const loadProgramForEdit = (pgmId) => {
        const pgm = data.programs.find(p => p.id === pgmId) || data.programs[0];
        if (pgm) {
          setSelectedEditProgramId(pgm.id);
          setEditCode(pgm.code);
          setEditName(pgm.name);
          setEditManager(pgm.manager || "");
          setEditBudget(pgm.budget || 100000);
        }
      };

      const loadResourceForEdit = (resId) => {
        const res = data.resources.find(r => r.id === resId) || data.resources[0];
        if (res) {
          setSelectedEditResourceId(res.id);
          setNewResourceName(res.name);
          setNewResourceRole(res.role || "Team Member");
          setNewResourceHours(Number(res.dailyHours || (res.name === "Mustafa Nisar" ? 10 : 8)));
          setNewResourceDaysWeek(Number(res.daysPerWeek || (res.name === "Mustafa Nisar" ? 7 : 5)));
          setNewResourceIsAgent(!!res.isAgent);
        }
      };

      const openManageModal = () => {
        setManageAction("edit");
        setManageType("project");
        const targetPrjId = selectedProjectId !== "ALL" ? selectedProjectId : (data.projects[0]?.id || "");
        loadProjectForEdit(targetPrjId);
        const targetPgmId = selectedProgramId !== "ALL" ? selectedProgramId : (data.programs[0]?.id || "");
        loadProgramForEdit(targetPgmId);
        if (data.resources.length > 0) loadResourceForEdit(data.resources[0].id);
        setShowManageModal(true);
      };

      // Risk Quick-Add State
      const [newRisk, setNewRisk] = useState({
        code: `RSK-0${(data?.risks?.length || 0) + 1}`,
        title: "",
        category: "Technical",
        probability: 3,
        impact: 3,
        strategy: "Mitigate",
        owner: "",
        status: "Open"
      });

      // Procurement Quick-Add State
      const [newPO, setNewPO] = useState({
        poNumber: `PO-${new Date().getFullYear()}-${String(Math.floor(Math.random() * 900) + 100)}`,
        vendor: "",
        category: "Software License",
        contractType: "FFP",
        committed: 5000,
        actual: 0,
        status: "Draft",
        terms: "Net 30",
        deliveryDate: addDaysISO(TODAY_ISO, 14)
      });

      useEffect(() => {
        if (!dbClient) {
          setIsAuthLoading(false);
          return;
        }
        dbClient.auth.getSession().then(({ data: { session } }) => {
          setUser(session?.user ?? null);
          setIsAuthLoading(false);
        });
        const { data: { subscription } } = dbClient.auth.onAuthStateChange((_event, session) => {
          setUser(session?.user ?? null);
          setIsAuthLoading(false);
        });
        return () => subscription.unsubscribe();
      }, [dbClient]);

      const pullWorkspace = async (activeUser) => {
        if (!dbClient || !activeUser) return;
        try {
          isPullingRef.current = true;
          setSyncStatus("Syncing with Cloud DB...");
          const { data: row, error } = await dbClient
            .from("workspaces")
            .select("state, updated_at")
            .eq("user_id", activeUser.id)
            .maybeSingle();

          if (error) throw error;

          if (row && row.state && row.state.programs) {
            const sanitizedState = {
              ...row.state,
              programs: row.state.programs || [],
              projects: row.state.projects || [],
              teamMembers: row.state.teamMembers || [],
              resources: (row.state.resources || INITIAL_EMPTY_WORKSPACE.resources).map(r => ({
                ...r,
                dailyHours: Number(r.dailyHours || (r.name === "Mustafa Nisar" ? 10 : 8)),
                daysPerWeek: Number(r.daysPerWeek || (r.name === "Mustafa Nisar" ? 7 : 5))
              })),
              operations: (row.state.operations || INITIAL_EMPTY_WORKSPACE.operations).map(op => ({
                ...op,
                assignments: op.assignments || [{ name: "Mustafa Nisar", allocation: 25, dailyHours: 2.5 }]
              })),
              risks: row.state.risks || [],
              procurements: row.state.procurements || [],
              tasks: (row.state.tasks || []).map(t => {
                const isM = t.itemType === "Milestone" || Number(t.duration) === 0;
                let taskAssignments = t.assignments;
                if (!taskAssignments || taskAssignments.length === 0) {
                  const rName = t.resource || "Lead";
                  const cap = getResourceCapacity(rName);
                  const alloc = Number(t.allocation || 100);
                  taskAssignments = [{
                    name: rName,
                    allocation: alloc,
                    dailyHours: Math.round((cap.dailyHours * (alloc / 100)) * 10) / 10
                  }];
                } else {
                  taskAssignments = taskAssignments.map(a => {
                    const cap = getResourceCapacity(a.name);
                    const alloc = Number(a.allocation || 100);
                    return {
                      ...a,
                      allocation: alloc,
                      dailyHours: a.dailyHours !== undefined ? Number(a.dailyHours) : Math.round((cap.dailyHours * (alloc / 100)) * 10) / 10
                    };
                  });
                }
                const durVal = Number(t.duration !== undefined ? t.duration : 1);
                const sDate = t.startDate || TODAY_ISO;
                const eDate = t.endDate || (isM ? sDate : addDaysISO(sDate, Math.ceil(durVal)));

                return {
                  ...t,
                  startDate: sDate,
                  endDate: eDate,
                  itemType: t.itemType || (isM ? "Milestone" : "Task"),
                  description: t.description || "",
                  duration: durVal,
                  assignments: taskAssignments,
                  resource: taskAssignments[0]?.name || "Lead",
                  allocation: taskAssignments[0]?.allocation || 100,
                  predecessors: t.predecessors || (t.predecessorId ? [{ id: t.predecessorId, type: t.depType || "FS", lag: Number(t.lag || 0) }] : [])
                };
              })
            };
            setData(sanitizedState);
            setLastSyncedAt(new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
            setSyncStatus("Cloud DB Synced");
          } else {
            const userHandle = activeUser.email ? activeUser.email.split("@")[0] : "Project Lead";
            const freshPgmId = "pgm-" + Date.now();
            const freshPrjId = "prj-" + (Date.now() + 1);
            const freshResId = "res-" + Date.now();

            const newAccountWorkspace = {
              programs: [
                { id: freshPgmId, code: "PGM-01", name: "Main Program", manager: userHandle, budget: 100000 }
              ],
              projects: [
                { id: freshPrjId, programId: freshPgmId, code: "PRJ-01", name: "Core Project", methodology: "Hybrid Agile", baselineStart: TODAY_ISO }
              ],
              teamMembers: [
                { id: "tm-1", email: activeUser.email, role: "Owner", permission: "Read-Write", addedAt: TODAY_ISO }
              ],
              resources: [
                { id: freshResId, name: userHandle, role: "Program Director / Lead", dailyHours: 10, daysPerWeek: 7, isAgent: false },
                { id: "res-agent-gemini", name: "Gemini", role: "Autonomous AI Agent", dailyHours: 8, daysPerWeek: 7, isAgent: true },
                { id: "res-agent-lovable", name: "Lovable", role: "Fullstack App Builder Agent", dailyHours: 6, daysPerWeek: 7, isAgent: true }
              ],
              operations: INITIAL_EMPTY_WORKSPACE.operations,
              tasks: [],
              risks: [],
              procurements: []
            };

            setData(newAccountWorkspace);
            await pushWorkspace(newAccountWorkspace, activeUser);
          }
        } catch (err) {
          setSyncStatus("Offline Cache");
        } finally {
          isInitialCloudLoadComplete.current = true;
          setTimeout(() => { isPullingRef.current = false; }, 300);
        }
      };

      const pushWorkspace = async (stateToSave, activeUser) => {
        if (!dbClient || !activeUser || !isInitialCloudLoadComplete.current) return;
        try {
          setSyncStatus("Saving to DB...");
          const { error } = await dbClient
            .from("workspaces")
            .upsert({
              user_id: activeUser.id,
              email: activeUser.email,
              state: stateToSave,
              updated_at: new Date().toISOString()
            });
          if (error) throw error;
          setLastSyncedAt(new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
          setSyncStatus("Cloud DB Synced");
        } catch (err) {
          setSyncStatus("Offline Cache");
        }
      };

      useEffect(() => {
        if (user) {
          isInitialCloudLoadComplete.current = false;
          pullWorkspace(user);
        }
      }, [user]);

      useEffect(() => {
        if (!user || isPullingRef.current || !isInitialCloudLoadComplete.current) return;
        const timer = setTimeout(() => {
          pushWorkspace(data, user);
        }, 600);
        return () => clearTimeout(timer);
      }, [data, user]);

      const handleAuth = async (mode) => {
        if (!dbClient) return;
        setAuthMessage("Processing...");
        try {
          if (mode === "magic") {
            const { error } = await dbClient.auth.signInWithOtp({ email: authEmail });
            if (error) throw error;
            setAuthMessage("Magic link sent!");
          } else if (mode === "signup") {
            const { error } = await dbClient.auth.signUp({ email: authEmail, password: authPassword });
            if (error) throw error;
            setAuthMessage("Account created! Check your email to confirm.");
          } else {
            const { error } = await dbClient.auth.signInWithPassword({ email: authEmail, password: authPassword });
            if (error) throw error;
            setAuthMessage("Signed in!");
          }
        } catch (err) {
          setAuthMessage(err.message || "Authentication failed");
        }
      };

      const programProjects = useMemo(() => {
        if (selectedProgramId === "ALL") return data.projects;
        return data.projects.filter(p => p.programId === selectedProgramId);
      }, [data.projects, selectedProgramId]);

      // Project Grouping
      const groupedVisibleTasks = useMemo(() => {
        const activeProjects = selectedProjectId !== "ALL"
          ? data.projects.filter(p => p.id === selectedProjectId)
          : (selectedProgramId !== "ALL" ? programProjects : data.projects);

        return activeProjects.map((prj, pIdx) => {
          const prjTasks = data.tasks.filter(t => t.projectId === prj.id || t.projectId === prj.code);
          return {
            project: prj,
            projectIndex: pIdx + 1,
            tasks: prjTasks
          };
        }).filter(g => g.tasks.length > 0 || selectedProjectId !== "ALL");
      }, [data.tasks, data.projects, selectedProjectId, selectedProgramId, programProjects]);

      const visibleTasks = useMemo(() => {
        return groupedVisibleTasks.flatMap(g => g.tasks);
      }, [groupedVisibleTasks]);

      // CPM Engine
      const cpmSchedule = useMemo(() => {
        if (visibleTasks.length === 0) {
          return { tasks: [], anchorDate: TODAY_ISO, totalSpanDays: 105, criticalCount: 0, rawMap: {} };
        }

        const taskMap = {};
        data.tasks.forEach(t => {
          const isMilestone = t.itemType === "Milestone" || Number(t.duration) === 0;
          const dur = isMilestone ? 0 : Math.max(0.01, Number(t.duration || 1));
          const sDate = t.startDate || TODAY_ISO;
          const eDate = t.endDate || (isMilestone ? sDate : addDaysISO(sDate, Math.ceil(dur)));

          taskMap[t.id] = {
            ...t,
            itemType: t.itemType || (isMilestone ? "Milestone" : "Task"),
            duration: dur,
            assignments: t.assignments || [{ name: t.resource || "Lead", allocation: Number(t.allocation || 100), dailyHours: 8 }],
            predecessors: t.predecessors || (t.predecessorId ? [{ id: t.predecessorId, type: t.depType || "FS", lag: Number(t.lag || 0) }] : []),
            esDate: sDate,
            efDate: eDate
          };
        });

        // Forward Pass
        let changed = true;
        let passes = 0;
        while (changed && passes < 30) {
          changed = false;
          passes++;
          Object.values(taskMap).forEach(t => {
            if (t.itemType !== "Summary" && t.predecessors && t.predecessors.length > 0) {
              let latestReqStart = t.esDate;
              t.predecessors.forEach(predRef => {
                const pred = taskMap[predRef.id];
                if (!pred) return;
                const dep = predRef.type || "FS";
                const lag = Number(predRef.lag || 0);
                let candidateStart = t.esDate;

                if (dep === "FS") candidateStart = addDaysISO(pred.efDate, lag);
                else if (dep === "SS") candidateStart = addDaysISO(pred.esDate, lag);
                else if (dep === "FF") candidateStart = addDaysISO(addDaysISO(pred.efDate, lag), -Math.ceil(t.duration));
                else if (dep === "SF") candidateStart = addDaysISO(addDaysISO(pred.esDate, lag), -Math.ceil(t.duration));

                if (candidateStart > latestReqStart) latestReqStart = candidateStart;
              });

              if (latestReqStart !== t.esDate) {
                t.esDate = latestReqStart;
                t.efDate = t.itemType === "Milestone" ? latestReqStart : addDaysISO(latestReqStart, Math.ceil(t.duration));
                changed = true;
              }
            }
          });
        }

        // Summary Task Rollups
        Object.values(taskMap).forEach(summaryCandidate => {
          if (summaryCandidate.itemType === "Summary") {
            const prefix = summaryCandidate.wbs + ".";
            const children = Object.values(taskMap).filter(c => c.wbs && c.wbs.startsWith(prefix) && c.id !== summaryCandidate.id);
            if (children.length > 0) {
              let minStart = children[0].esDate;
              let maxEnd = children[0].efDate;
              children.forEach(c => {
                if (c.esDate < minStart) minStart = c.esDate;
                if (c.efDate > maxEnd) maxEnd = c.efDate;
              });
              summaryCandidate.esDate = minStart;
              summaryCandidate.efDate = maxEnd;
              summaryCandidate.duration = Math.max(1, diffDaysISO(minStart, maxEnd));
            }
          }
        });

        const visibleNodes = visibleTasks.map(vt => taskMap[vt.id] || vt);
        const earliestISO = visibleNodes.reduce((min, t) => (t.esDate && t.esDate < min ? t.esDate : min), visibleNodes[0]?.esDate || TODAY_ISO);

        visibleNodes.forEach(t => {
          t.es = Math.max(0, diffDaysISO(earliestISO, t.esDate || TODAY_ISO));
          t.ef = t.es + (t.itemType === "Milestone" ? 0 : t.duration);
        });

        // Backward Pass
        const maxEF = Math.max(...visibleNodes.map(n => n.ef), 1);
        visibleNodes.forEach(n => { n.lf = maxEF; n.ls = n.lf - n.duration; });

        for (let i = 0; i < visibleNodes.length + 2; i++) {
          visibleNodes.forEach(n => {
            const successors = visibleNodes.filter(s => s.predecessors?.some(p => p.id === n.id));
            if (successors.length > 0) {
              let minLF = maxEF;
              successors.forEach(succ => {
                const rel = succ.predecessors.find(p => p.id === n.id);
                const lag = Number(rel?.lag || 0);
                const dep = rel?.type || "FS";
                let reqLF = maxEF;

                if (dep === "FS") reqLF = succ.ls - lag;
                else if (dep === "SS") reqLF = succ.ls - lag + n.duration;
                else if (dep === "FF") reqLF = succ.lf - lag;
                else if (dep === "SF") reqLF = succ.lf - lag + n.duration;

                if (reqLF < minLF) minLF = reqLF;
              });
              n.lf = minLF;
              n.ls = n.lf - n.duration;
            }
          });
        }

        visibleNodes.forEach(n => {
          n.float = Math.max(0, Math.round((n.ls - n.es) * 100) / 100);
          n.isCritical = n.float === 0 && !n.done && n.itemType !== "Summary";
        });

        return {
          tasks: visibleNodes,
          anchorDate: earliestISO,
          totalSpanDays: Math.max(105, Math.ceil(maxEF) + 21),
          criticalCount: visibleNodes.filter(n => n.isCritical).length,
          rawMap: taskMap
        };
      }, [visibleTasks, data.tasks]);

      // Resource Loading Heatmap
      const resourceLoadingMap = useMemo(() => {
        const loading = {};
        (data.resources || []).forEach(r => {
          const cap = getResourceCapacity(r.name);
          loading[r.name] = {
            totalOverAllocDays: 0,
            capacity: cap,
            days: {}
          };
        });

        // Ingest Project Tasks
        data.tasks.forEach(task => {
          if (task.done || task.itemType === "Milestone" || task.itemType === "Summary") return;
          const start = task.startDate || TODAY_ISO;
          const dur = Math.max(1, Math.ceil(Number(task.duration || 1)));
          const taskAssignments = task.assignments || [{ name: task.resource || "Lead", allocation: Number(task.allocation || 100) }];

          for (let d = 0; d < dur; d++) {
            const dateISO = addDaysISO(start, d);
            taskAssignments.forEach(asgn => {
              const rName = asgn.name;
              const cap = getResourceCapacity(rName);
              if (!loading[rName]) {
                loading[rName] = { totalOverAllocDays: 0, capacity: cap, days: {} };
              }
              if (!loading[rName].days[dateISO]) {
                loading[rName].days[dateISO] = { totalHours: 0, projectHours: 0, opsHours: 0, items: [] };
              }
              const dailyH = asgn.dailyHours !== undefined
                ? Number(asgn.dailyHours)
                : Math.round((cap.dailyHours * (Number(asgn.allocation || 100) / 100)) * 10) / 10;

              loading[rName].days[dateISO].totalHours += dailyH;
              loading[rName].days[dateISO].projectHours += dailyH;
              loading[rName].days[dateISO].items.push({
                type: "Project Deliverable",
                name: `[${task.wbs}] ${task.name}`,
                hours: dailyH,
                alloc: Math.round((dailyH / cap.dailyHours) * 100)
              });
            });
          }
        });

        // Ingest Operations
        const totalHorizonDays = cpmSchedule.totalSpanDays || 105;
        const anchorISO = cpmSchedule.anchorDate || TODAY_ISO;

        (data.operations || []).forEach(op => {
          if (!op.active) return;
          const opAssignments = op.assignments || [];

          for (let d = 0; d < totalHorizonDays; d++) {
            const dateISO = addDaysISO(anchorISO, d);
            const dt = parseISO(dateISO);
            const dayOfWeek = dt.getDay();

            let runsToday = false;
            if (op.cadence === "daily_7days") {
              runsToday = true;
            } else if (op.cadence === "daily_weekdays" || op.cadence === "twice_daily") {
              runsToday = (dayOfWeek >= 1 && dayOfWeek <= 5);
            } else if (op.cadence === "weekly_mon") {
              runsToday = (dayOfWeek === 1);
            }

            if (runsToday) {
              opAssignments.forEach(asgn => {
                const rName = asgn.name;
                const cap = getResourceCapacity(rName);
                if (!loading[rName]) {
                  loading[rName] = { totalOverAllocDays: 0, capacity: cap, days: {} };
                }
                if (!loading[rName].days[dateISO]) {
                  loading[rName].days[dateISO] = { totalHours: 0, projectHours: 0, opsHours: 0, items: [] };
                }
                const dailyH = asgn.dailyHours !== undefined
                  ? Number(asgn.dailyHours)
                  : Math.round((cap.dailyHours * (Number(asgn.allocation || 25) / 100)) * 10) / 10;

                loading[rName].days[dateISO].totalHours += dailyH;
                loading[rName].days[dateISO].opsHours += dailyH;
                loading[rName].days[dateISO].items.push({
                  type: "Recurring Operation",
                  name: op.name,
                  hours: dailyH,
                  alloc: Math.round((dailyH / cap.dailyHours) * 100)
                });
              });
            }
          }
        });

        Object.keys(loading).forEach(rName => {
          let overCount = 0;
          const maxDailyH = loading[rName].capacity.dailyHours;
          Object.values(loading[rName].days).forEach(day => {
            if (day.totalHours > maxDailyH) overCount++;
          });
          loading[rName].totalOverAllocDays = overCount;
        });

        return loading;
      }, [data.tasks, data.resources, data.operations, cpmSchedule.anchorDate, cpmSchedule.totalSpanDays]);

      // Timeline scale generator
      const timelineUnits = useMemo(() => {
        const totalDays = cpmSchedule.totalSpanDays;
        const anchor = cpmSchedule.anchorDate;

        if (ganttScale === "day") {
          return Array.from({ length: totalDays }, (_, i) => {
            const iso = addDaysISO(anchor, i);
            const holiday = activeStatHolidays.find(h => h.date === iso);
            return {
              key: i,
              label: formatShortDate(iso),
              subLabel: `D${i + 1}`,
              iso,
              widthPx: 42,
              isHoliday: !!holiday,
              holidayName: holiday?.name
            };
          });
        } else if (ganttScale === "week") {
          const numWeeks = Math.ceil(totalDays / 7);
          return Array.from({ length: numWeeks }, (_, i) => {
            const startISO = addDaysISO(anchor, i * 7);
            const endISO = addDaysISO(startISO, 6);
            const holidaysInWeek = activeStatHolidays.filter(h => h.date >= startISO && h.date <= endISO);
            return {
              key: i,
              label: `W${i + 1}`,
              subLabel: formatShortDate(startISO),
              iso: startISO,
              widthPx: 64,
              isHoliday: holidaysInWeek.length > 0,
              holidayName: holidaysInWeek.map(h => h.name).join(", ")
            };
          });
        } else if (ganttScale === "month") {
          const numMonths = Math.ceil(totalDays / 30);
          return Array.from({ length: numMonths }, (_, i) => {
            const startISO = addDaysISO(anchor, i * 30);
            const endISO = addDaysISO(startISO, 29);
            const d = parseISO(startISO);
            const holidaysInMonth = activeStatHolidays.filter(h => h.date >= startISO && h.date <= endISO);
            return {
              key: i,
              label: d.toLocaleDateString("en-US", { month: "short", year: "2-digit" }),
              subLabel: `M${i + 1}`,
              iso: startISO,
              widthPx: 110,
              isHoliday: holidaysInMonth.length > 0,
              holidayName: holidaysInMonth.map(h => h.name).join(", ")
            };
          });
        } else {
          const numQuarters = Math.ceil(totalDays / 90);
          return Array.from({ length: numQuarters }, (_, i) => {
            const startISO = addDaysISO(anchor, i * 90);
            const endISO = addDaysISO(startISO, 89);
            const holidaysInQ = activeStatHolidays.filter(h => h.date >= startISO && h.date <= endISO);
            return {
              key: i,
              label: `Q${Math.floor(i % 4) + 1} '26`,
              subLabel: formatShortDate(startISO),
              iso: startISO,
              widthPx: 160,
              isHoliday: holidaysInQ.length > 0,
              holidayName: holidaysInQ.map(h => h.name).join(", ")
            };
          });
        }
      }, [cpmSchedule.totalSpanDays, cpmSchedule.anchorDate, ganttScale, activeStatHolidays]);

      const pxPerDay = useMemo(() => {
        if (ganttScale === "day") return 42;
        if (ganttScale === "week") return 64 / 7;
        if (ganttScale === "month") return 110 / 30;
        return 160 / 90;
      }, [ganttScale]);

      // Reordering Handlers
      const moveTaskOrder = (taskId, direction) => {
        const index = data.tasks.findIndex(t => t.id === taskId);
        if (index < 0) return;
        const targetIndex = direction === "up" ? index - 1 : index + 1;
        if (targetIndex < 0 || targetIndex >= data.tasks.length) return;

        const updated = [...data.tasks];
        const [moved] = updated.splice(index, 1);
        updated.splice(targetIndex, 0, moved);
        setData(prev => ({ ...prev, tasks: updated }));
      };

      // Add Deliverable
      const handleAddItem = (e) => {
        e.preventDefault();
        if (!qaName.trim()) return;
        const targetPrjId = selectedProjectId !== "ALL" ? selectedProjectId : (programProjects[0]?.id || data.projects[0]?.id);
        const isMilestone = qaType === "Milestone";
        const parsedDur = isMilestone ? 0 : Math.max(0.01, parseFloat(qaDuration) || 1);
        const assignedRes = qaResource || (data.resources[0]?.name || "Lead");
        const cap = getResourceCapacity(assignedRes);

        const prjIdx = data.projects.findIndex(p => p.id === targetPrjId);
        const pSeq = prjIdx >= 0 ? prjIdx + 1 : 1;
        const prjTasks = data.tasks.filter(t => t.projectId === targetPrjId);
        const suggestedWbs = `${pSeq}.${prjTasks.length + 1}`;

        const verifiedStart = qaStartDate || TODAY_ISO;
        const verifiedEnd = isMilestone ? verifiedStart : addDaysISO(verifiedStart, Math.ceil(parsedDur));
        const hoursVal = Number(qaHoursPerDay || (cap.dailyHours * (Number(qaAllocation || 100) / 100)));

        const newItem = {
          id: "tsk-" + Date.now(),
          projectId: targetPrjId,
          itemType: qaType,
          wbs: qaWbs.trim() || suggestedWbs,
          name: qaName.trim(),
          description: "",
          startDate: verifiedStart,
          endDate: verifiedEnd,
          duration: parsedDur,
          predecessors: [],
          assignments: [{
            name: assignedRes,
            allocation: Number(qaAllocation || 100),
            dailyHours: hoursVal
          }],
          resource: assignedRes,
          allocation: Number(qaAllocation || 100),
          status: "To Do",
          done: false,
          pv: isMilestone ? 0 : 5000,
          ac: 0
        };

        setData(prev => ({ ...prev, tasks: [...prev.tasks, newItem] }));
        setQaName("");
        setQaWbs("");
      };

      // Field Update
      const updateTaskField = (taskId, field, value) => {
        setData(prev => ({
          ...prev,
          tasks: prev.tasks.map(t => {
            if (t.id !== taskId) return t;
            const updated = { ...t };

            if (field === "itemType") {
              updated.itemType = value;
              if (value === "Milestone") {
                updated.duration = 0;
                updated.endDate = updated.startDate;
              } else if (value === "Task") {
                if (Number(updated.duration) <= 0) {
                  updated.duration = 1;
                  updated.endDate = addDaysISO(updated.startDate, 1);
                }
              }
            } else if (field === "duration") {
              const parsed = parseFloat(value);
              if (isNaN(parsed) || parsed <= 0) {
                updated.duration = 0;
                updated.itemType = "Milestone";
                updated.endDate = updated.startDate;
              } else {
                updated.duration = parsed;
                if (updated.itemType === "Milestone") updated.itemType = "Task";
                updated.endDate = addDaysISO(updated.startDate, Math.ceil(parsed));
              }
            } else if (field === "startDate") {
              updated.startDate = value;
              updated.endDate = updated.itemType === "Milestone" ? value : addDaysISO(value, Math.ceil(updated.duration));
            } else if (field === "endDate") {
              updated.endDate = value;
              const diff = diffDaysISO(updated.startDate || TODAY_ISO, value);
              if (diff > 0) {
                updated.duration = diff;
                if (updated.itemType === "Milestone") updated.itemType = "Task";
              } else {
                updated.duration = 0;
                updated.itemType = "Milestone";
              }
            } else if (field === "done") {
              updated.done = value;
              updated.status = value ? "Done" : "In Progress";
            } else {
              updated[field] = value;
            }
            return updated;
          })
        }));
      };

      const deleteTask = (taskId) => {
        if (!confirm("Delete this deliverable?")) return;
        setData(prev => ({
          ...prev,
          tasks: prev.tasks
            .filter(t => t.id !== taskId)
            .map(t => ({
              ...t,
              predecessors: (t.predecessors || []).filter(p => p.id !== taskId)
            }))
        }));
      };

      const updateTaskAssignments = (taskId, newAssignments) => {
        setData(prev => ({
          ...prev,
          tasks: prev.tasks.map(t => {
            if (t.id !== taskId) return t;
            return {
              ...t,
              assignments: newAssignments,
              resource: newAssignments[0]?.name || "Lead",
              allocation: newAssignments[0]?.allocation || 100
            };
          })
        }));
      };

      const addPredecessor = (taskId, predId, type = "FS", lag = 0) => {
        if (!predId || predId === taskId) return;
        setData(prev => ({
          ...prev,
          tasks: prev.tasks.map(t => {
            if (t.id !== taskId) return t;
            const existing = t.predecessors || [];
            if (existing.some(p => p.id === predId)) return t;
            return { ...t, predecessors: [...existing, { id: predId, type, lag: Number(lag || 0) }] };
          })
        }));
      };

      const removePredecessor = (taskId, predId) => {
        setData(prev => ({
          ...prev,
          tasks: prev.tasks.map(t => {
            if (t.id !== taskId) return t;
            return { ...t, predecessors: (t.predecessors || []).filter(p => p.id !== predId) };
          })
        }));
      };

      // Operations CRUD Handlers
      const handleAddOperation = (e) => {
        e.preventDefault();
        if (!newOpName.trim()) return;
        const rName = newOpResource || (data.resources[0]?.name || "Lead");
        const cap = getResourceCapacity(rName);
        const hoursVal = Number(newOpHours || (cap.dailyHours * (Number(newOpAlloc || 25) / 100)));

        const newOp = {
          id: "ops-" + Date.now(),
          name: newOpName.trim(),
          cadence: newOpCadence,
          active: true,
          assignments: [
            {
              name: rName,
              allocation: Number(newOpAlloc || 25),
              dailyHours: hoursVal
            }
          ]
        };
        setData(prev => ({ ...prev, operations: [...(prev.operations || []), newOp] }));
        setNewOpName("");
      };

      const updateOperationField = (opId, field, value) => {
        setData(prev => ({
          ...prev,
          operations: (prev.operations || []).map(o => {
            if (o.id !== opId) return o;
            return { ...o, [field]: value };
          })
        }));
      };

      const updateOperationAssignments = (opId, newAssignments) => {
        setData(prev => ({
          ...prev,
          operations: (prev.operations || []).map(o => {
            if (o.id !== opId) return o;
            return { ...o, assignments: newAssignments };
          })
        }));
      };

      const toggleOperationActive = (opId) => {
        setData(prev => ({
          ...prev,
          operations: (prev.operations || []).map(o => o.id === opId ? { ...o, active: !o.active } : o)
        }));
      };

      const deleteOperation = (opId) => {
        if (!confirm("Delete this recurring operation?")) return;
        setData(prev => ({
          ...prev,
          operations: (prev.operations || []).filter(o => o.id !== opId)
        }));
      };

      // Full CRUD Submit Handler
      const handleProgramProjectSubmit = async (e) => {
        e.preventDefault();

        if (manageAction === "create") {
          if (manageType === "team") {
            if (!newMemberEmail.trim()) return;
            const newMember = {
              id: "tm-" + Date.now(),
              email: newMemberEmail.trim(),
              role: newMemberRole,
              permission: newMemberRole === "Editor" ? "Read-Write" : "Read-Only",
              addedAt: TODAY_ISO
            };
            setData(prev => ({ ...prev, teamMembers: [...(prev.teamMembers || []), newMember] }));

            if (dbClient) {
              try {
                await dbClient.auth.signInWithOtp({ email: newMemberEmail.trim() });
                alert(`Invitation sent to ${newMemberEmail.trim()}!`);
              } catch (err) {
                alert(`Team member added. Notice could not be dispatched: ${err.message}`);
              }
            }
            setNewMemberEmail("");
          } else if (manageType === "resource") {
            if (!newResourceName.trim()) return;
            const newRes = {
              id: "res-" + Date.now(),
              name: newResourceName.trim(),
              role: newResourceRole,
              dailyHours: Number(newResourceHours || 8),
              daysPerWeek: Number(newResourceDaysWeek || 5),
              isAgent: !!newResourceIsAgent
            };
            setData(prev => ({ ...prev, resources: [...(prev.resources || []), newRes] }));
            setNewResourceName("");
            setNewResourceIsAgent(false);
          } else if (manageType === "program") {
            if (!editName.trim()) return;
            const newId = "pgm-" + Date.now();
            const newPgm = {
              id: newId,
              code: editCode.trim() || `PGM-0${data.programs.length + 1}`,
              name: editName.trim(),
              manager: editManager || (user?.email?.split("@")[0] || "Program Manager"),
              budget: Number(editBudget || 100000)
            };
            setData(prev => ({ ...prev, programs: [...prev.programs, newPgm] }));
            setSelectedProgramId(newId);
          } else {
            if (!editName.trim()) return;
            const newId = "prj-" + Date.now();
            const parentPgm = editParentPgmId || (selectedProgramId !== "ALL" ? selectedProgramId : data.programs[0]?.id);
            const count = data.projects.filter(p => p.programId === parentPgm).length;
            const newPrj = {
              id: newId,
              programId: parentPgm,
              code: editCode.trim() || `PRJ-0${count + 1}`,
              name: editName.trim(),
              methodology: editMethodology || "Hybrid Agile",
              baselineStart: TODAY_ISO
            };
            setData(prev => ({ ...prev, projects: [...prev.projects, newPrj] }));
            setSelectedProjectId(newId);
          }
        } else if (manageAction === "edit") {
          if (manageType === "program") {
            setData(prev => ({
              ...prev,
              programs: prev.programs.map(p => p.id === selectedEditProgramId ? {
                ...p, code: editCode, name: editName, manager: editManager, budget: Number(editBudget || 0)
              } : p)
            }));
          } else if (manageType === "project") {
            setData(prev => ({
              ...prev,
              projects: prev.projects.map(p => p.id === selectedEditProjectId ? {
                ...p, code: editCode, name: editName, methodology: editMethodology

              {/* CARD 2: Dedicated Full-Width Gantt Chart with CLEAN ORTHOGONAL CONNECTOR OBJECTS */}

                      </h3>
                      <div className="text-[11px] text-slate-500">

                      </div>

                      <div className="flex items-center gap-3 text-[11px] pl-2 border-l border-slate-300 dark:border-slate-700">

                        <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded bg-brand-emerald"></span> Standard</span>

                      </div>

                  <div className="overflow-x-auto relative p-4">
                    <div style={{ width: `${Math.max(900, cpmSchedule.totalSpanDays * pxPerDay + 260)}px` }} className="relative select-none">
                      {/* Timeline Header (Height: 46px) */}
                      <div className="flex border-b border-slate-200 dark:border-slate-800 pb-2 mb-2 pl-[260px] h-[46px]">

                      </div>

                      {/* SVG Canvas for CLEAN ORTHOGONAL (MANHATTAN) CONNECTOR LINES */}
                      <svg
                        className="absolute inset-0 pointer-events-none"
                        style={{
                          width: `${cpmSchedule.totalSpanDays * pxPerDay + 260}px`,
                          height: `${cpmSchedule.tasks.length * 44 + 60}px`
                        }}
                      >
                        <defs>
                          <marker id="arrow-critical" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f43f5e" />
                          </marker>
                          <marker id="arrow-normal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
                          </marker>
                        </defs>
                        {cpmSchedule.tasks.map((succ, sIdx) => {
                          // Mathematically locked to the exact vertical midpoint of row sIdx
                          const sY = 54 + (sIdx * 44) + 16;
                          const sLeft = 260 + succ.es * pxPerDay;
                          const sWidth = Math.max(16, (succ.itemType === "Milestone" ? 0 : succ.duration) * pxPerDay - 4);
                          const sRight = sLeft + sWidth;

                          // Successor Connectors (Exact Midpoints of edges)
                          const sStartConn = { x: sLeft, y: sY };
                          const sFinishConn = { x: succ.itemType === "Milestone" ? sLeft : sRight, y: sY };

                          return (succ.predecessors || []).map((pRef, pIdx) => {
                            const pIdxFound = cpmSchedule.tasks.findIndex(t => t.id === pRef.id);
                            if (pIdxFound < 0) return null;
                            const pred = cpmSchedule.tasks[pIdxFound];
                            // Mathematically locked to the exact vertical midpoint of row pIdxFound
                            const pY = 54 + (pIdxFound * 44) + 16;
                            const pLeft = 260 + pred.es * pxPerDay;
                            const pWidth = Math.max(16, (pred.itemType === "Milestone" ? 0 : pred.duration) * pxPerDay - 4);
                            const pRight = pLeft + pWidth;

                            // Predecessor Connectors (Exact Midpoints of edges)
                            const pStartConn = { x: pLeft, y: pY };
                            const pFinishConn = { x: pred.itemType === "Milestone" ? pLeft : pRight, y: pY };

                            const isCritLink = succ.isCritical && pred.isCritical;
                            const dep = pRef.type || "FS";

                            // Find rightmost bound of all intermediate tasks between pIdxFound and sIdx to avoid passing through them
                            const minIdx = Math.min(pIdxFound, sIdx);
                            const maxIdx = Math.max(pIdxFound, sIdx);
                            let maxIntermediateRight = Math.max(pRight, sRight);
                            for (let k = minIdx; k <= maxIdx; k++) {
                              const intermediateTask = cpmSchedule.tasks[k];
                              if (intermediateTask) {
                                const iLeft = 260 + intermediateTask.es * pxPerDay;
                                const iWidth = Math.max(16, (intermediateTask.itemType === "Milestone" ? 0 : intermediateTask.duration) * pxPerDay - 4);
                                if (iLeft + iWidth > maxIntermediateRight) {
                                  maxIntermediateRight = iLeft + iWidth;
                                }
                              }
                            }

                            let pathD = "";
                            const trunkOffset = 14;

                            if (dep === "FS") {
                              const exitX = pFinishConn.x;
                              const enterX = sStartConn.x;

                              if (enterX >= exitX + 24) {
                                // Clear forward routing: Drop in midpoint corridor between predecessor finish and successor start
                                const midX = Math.round((exitX + enterX) / 2);
                                pathD = `M ${exitX} ${pY} H ${midX} V ${sY} H ${enterX - 2}`;
                              } else {
                                // Backward loop around intermediate tasks so it never cuts through them
                                const loopRight = maxIntermediateRight + 16;
                                const loopLeft = Math.min(exitX, enterX) - 16;
                                pathD = `M ${exitX} ${pY} H ${loopRight} V ${sY - 14} H ${loopLeft} V ${sY} H ${enterX - 2}`;
                              }
                            } else if (dep === "FF") {
                              // Finish-to-Finish: Routes along the clean right margin, avoiding intermediate objects
                              const exitX = pFinishConn.x;
                              const enterX = sFinishConn.x;
                              const clearRight = maxIntermediateRight + trunkOffset;
                              // Aligned combined entry into the right connector
                              pathD = `M ${exitX} ${pY} H ${clearRight} V ${sY} H ${enterX + 2}`;
                            } else if (dep === "SS") {
                              // Start-to-Start: Routes along the clean left margin
                              const exitX = pStartConn.x;
                              const enterX = sStartConn.x;
                              const clearLeft = Math.min(exitX, enterX) - 16;
                              pathD = `M ${exitX} ${pY} H ${clearLeft} V ${sY} H ${enterX - 2}`;
                            } else {
                              // Start-to-Finish (SF)
                              const exitX = pStartConn.x;
                              const enterX = sFinishConn.x;
                              const clearRight = maxIntermediateRight + trunkOffset;
                              pathD = `M ${exitX} ${pY} H ${clearRight} V ${sY} H ${enterX + 2}`;
                            }

                            // Distinct dash patterns based on dependency type
                            let dashPattern = "";
                            if (dep === "FF") dashPattern = "6,4";          // Dashed for Finish-to-Finish
                            else if (dep === "SS") dashPattern = "8,3,2,3";  // Dash-Dot for Start-to-Start
                            else if (dep === "SF") dashPattern = "2,3";      // Dotted for Start-to-Finish

                            return (
                              <path
                                key={`${succ.id}-${pIdx}`}
                                d={pathD}
                                fill="none"
                                stroke={isCritLink ? "#f43f5e" : "#10b981"}
                                strokeWidth={isCritLink ? "2" : "1.5"}
                                strokeDasharray={dashPattern}
                                strokeLinejoin="miter"
                                strokeMiterlimit="10"
                                markerEnd={isCritLink ? "url(#arrow-critical)" : "url(#arrow-normal)"}
                                opacity="0.9"
                              />
                            );
                          });
                        })}
                      </svg>

                      {/* Deliverable Gantt Rows with Explicit Endpoint Connector Anchor Dots */}
                      <div className="space-y-2">
                        {cpmSchedule.tasks.map((t) => {
                          const leftPos = 260 + t.es * pxPerDay;
                          const widthPx = Math.max(16, (t.itemType === "Milestone" ? 0 : t.duration) * pxPerDay - 4);
                          const isMilestone = t.itemType === "Milestone";
                          const isSummary = t.itemType === "Summary";
                          const taskPrj = data.projects.find(p => p.id === t.projectId);

                          return (
                            <div key={t.id} className="flex items-center h-[36px] relative hover:bg-slate-50 dark:hover:bg-slate-800/30 rounded">
                              <div className="w-[260px] shrink-0 pr-3 truncate text-xs font-medium text-slate-700 dark:text-slate-300 flex items-center justify-between">
                                <span className="truncate">
                                  <span className="font-mono text-[9px] px-1 py-0.5 rounded bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 mr-1.5 font-bold">
                                    {taskPrj?.code || 'PRJ'}
                                  </span>
                                  {t.wbs} {t.name}
                                </span>
                                <span className="text-[10px] text-slate-400 font-mono ml-1">{isMilestone ? "0d" : `${t.duration}d`}</span>
                              </div>

                              {isMilestone ? (
                                <div
                                  style={{ left: `${leftPos - 10}px` }}
                                  className={`absolute w-5 h-5 rotate-45 flex items-center justify-center shadow-md transition z-10 ${
                                    t.done ? "bg-slate-500" : t.isCritical ? "bg-rose-500" : "bg-brand-emerald"
                                  }`}
                                  title={`Milestone: ${t.wbs} ${t.name} (${t.esDate})`}
                                >
                                  <div className="w-1.5 h-1.5 bg-white rounded-full -rotate-45" />
                                </div>
                              ) : isSummary ? (
                                <div
                                  style={{ left: `${leftPos}px`, width: `${widthPx}px` }}
                                  className="absolute h-3 bg-slate-700 border-t-2 border-b-2 border-slate-400 rounded-sm z-10"
                                  title={`Summary Task: ${t.wbs} ${t.name}`}
                                >
                                  <div className="absolute -left-1 -top-1 w-2 h-5 bg-slate-400" />
                                  <div className="absolute -right-1 -top-1 w-2 h-5 bg-slate-400" />
                                </div>
                              ) : (
                                <div
                                  style={{ left: `${leftPos}px`, width: `${widthPx}px` }}
                                  className={`absolute h-7 rounded-md px-2 flex items-center justify-between text-[10px] font-semibold shadow-sm transition z-10 ${

                    <div>
                      <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Team Resources & AI Agents</h4>
                      <div className="space-y-1.5">
                        {(data.resources || []).map(res => (
                          <div key={res.id} className="flex items-center justify-between p-2.5 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 text-xs">
                            <div>
                              <span className="font-bold text-slate-900 dark:text-white">{res.isAgent ? "🤖 " : ""}{res.name}</span>
                              <span className="text-[10px] text-slate-500 ml-2">({res.role}) • {res.dailyHours || 8}h/d, {res.daysPerWeek || 5}d/w</span>
                            </div>
                            <div className="flex items-center gap-2">
                              <button
                                onClick={() => {
                                  setManageAction("edit");
                                  setManageType("resource");
                                  loadResourceForEdit(res.id);
                                }}
                                className="text-brand-emerald font-semibold hover:underline"
                              >
                                Edit
                              </button>
                              <button onClick={() => deleteResource(res.id)} className="text-slate-400 hover:text-rose-500 font-bold px-2 py-1">✕</button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Executive Report Export Modal */}
          {showReportModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white dark:bg-[#111827] border border-slate-200 dark:border-slate-800 rounded-3xl p-6 w-full max-w-3xl space-y-4 shadow-2xl max-h-[90vh] flex flex-col">
                <div className="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
                  <h3 className="font-bold text-base text-slate-900 dark:text-white">Executive PPM Status Report</h3>
                  <div className="flex gap-2">
                    <button
                      onClick={copyReportToClipboard}
                      className="bg-brand-emerald hover:bg-brand-emeraldHover text-brand-navy font-bold text-xs px-3 py-1.5 rounded-lg transition"
                    >
                      📋 Copy for Google Docs
                    </button>
                    <button
                      onClick={() => window.print()}
                      className="bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 text-xs font-semibold px-3 py-1.5 rounded-lg transition"
                    >
                      🖨️ Print / PDF
                    </button>
                    <button onClick={() => setShowReportModal(false)} className="text-slate-400 hover:text-white px-2">✕</button>
                  </div>
                </div>

                <div id="executive-report-content" className="flex-1 overflow-y-auto p-4 bg-slate-50 dark:bg-slate-900/50 rounded-2xl border border-slate-200 dark:border-slate-800 text-xs space-y-4 text-slate-800 dark:text-slate-200">
                  <div className="border-b border-slate-300 dark:border-slate-700 pb-3">
                    <h2 className="text-base font-bold text-brand-emerald">Apex PPM — Executive Project & Program Report</h2>
                    <p className="text-[11px] text-slate-500">Date: {new Date().toLocaleDateString("en-US", { dateStyle: "full" })}</p>
                  </div>

                  <div className="grid grid-cols-4 gap-3">
                    <div className="p-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700">
                      <div className="text-[10px] text-slate-400 font-bold uppercase">Total Deliverables</div>
                      <div className="text-lg font-bold">{cpmSchedule.tasks.length}</div>
                    </div>
                    <div className="p-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700">
                      <div className="text-[10px] text-slate-400 font-bold uppercase">Active Operations</div>
                      <div className="text-lg font-bold text-brand-emerald">{(data.operations || []).filter(o => o.active).length}</div>
                    </div>
                    <div className="p-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700">
                      <div className="text-[10px] text-slate-400 font-bold uppercase">Critical Path Count</div>
                      <div className="text-lg font-bold text-rose-500">{cpmSchedule.criticalCount}</div>
                    </div>
                    <div className="p-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700">
                      <div className="text-[10px] text-slate-400 font-bold uppercase">Open Risks</div>
                      <div className="text-lg font-bold text-amber-500">{(data.risks || []).filter(r => r.status === 'Open').length}</div>
                    </div>
                  </div>

                  <h3 className="font-bold text-xs uppercase tracking-wider text-slate-700 dark:text-slate-300 pt-2">Schedule Deliverables & Milestones</h3>
                  <table className="w-full border-collapse text-left border border-slate-300 dark:border-slate-700">
                    <thead>
                      <tr className="bg-slate-200 dark:bg-slate-800 text-[10px]">
                        <th className="p-2 border border-slate-300 dark:border-slate-700">WBS</th>
                        <th className="p-2 border border-slate-300 dark:border-slate-700">Type</th>
                        <th className="p-2 border border-slate-300 dark:border-slate-700">Deliverable Name</th>
                        <th className="p-2 border border-slate-300 dark:border-slate-700">Start Date</th>
                        <th className="p-2 border border-slate-300 dark:border-slate-700">End Date</th>
                        <th className="p-2 border border-slate-300 dark:border-slate-700">Dur</th>
                        <th className="p-2 border border-slate-300 dark:border-slate-700">Float</th>
                        <th className="p-2 border border-slate-300 dark:border-slate-700">Resources & Hours</th>
                      </tr>
                    </thead>
                    <tbody>
                      {cpmSchedule.tasks.map(t => (
                        <tr key={t.id} className={t.isCritical ? "font-bold text-rose-500" : ""}>
                          <td className="p-2 border border-slate-300 dark:border-slate-700 font-mono">{t.wbs}</td>
                          <td className="p-2 border border-slate-300 dark:border-slate-700">{t.itemType || "Task"}</td>
                          <td className="p-2 border border-slate-300 dark:border-slate-700">{t.name}</td>
                          <td className="p-2 border border-slate-300 dark:border-slate-700">{t.esDate}</td>
                          <td className="p-2 border border-slate-300 dark:border-slate-700">{t.efDate}</td>
                          <td className="p-2 border border-slate-300 dark:border-slate-700">{t.duration}d</td>
                          <td className="p-2 border border-slate-300 dark:border-slate-700">{t.float}d</td>
                          <td className="p-2 border border-slate-300 dark:border-slate-700">
                            {(t.assignments || []).map(a => `${a.name} (${a.dailyHours || 8}h • ${a.allocation}%)`).join(", ") || t.resource}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
